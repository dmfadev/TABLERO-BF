<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tablero de Relevamiento — Banco Familiar</title>
<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/dmfadev/TABLERO-BF/main/logoBancoFamiliar.webp"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D5C9B;--blue:#1A7AC2;--blue-mid:#2E8FD4;
  --bsoft:#D6EAF8;--bpale:#EBF5FB;--bxpal:#F4FAFF;
  --yellow:#F5A800;--ysoft:#FFF8E6;
  --white:#fff;--bg:#EEF6FC;--border:#C8DFF0;--border2:#DCF0FA;
  --text:#0B2A4A;--muted:#4A7CA0;--muted2:#7EB3D4;
  --green:#1A7A4A;--gsoft:#E8F5EE;
  --red:#B03A2E;--rsoft:#FCEAE8;
  --orange:#C0600A;--osoft:#FEF3E6;
  --sh:0 2px 10px rgba(13,92,155,.08);--shm:0 6px 24px rgba(13,92,155,.13);
  --r:10px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.hdr{background:var(--white);padding:0 36px;display:flex;align-items:center;justify-content:space-between;height:68px;border-bottom:2px solid var(--border);box-shadow:var(--sh);position:sticky;top:0;z-index:200}
.hdr-l{display:flex;align-items:center;gap:16px}
.logo{height:50px}
.logo-fb{color:var(--navy);font-weight:700;font-size:15px;display:none}
.hdiv{width:1px;height:30px;background:var(--border)}
.htitle{color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase}
.pbadge{background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:5px 14px;border-radius:16px}
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 36px;display:flex;gap:2px;position:sticky;top:68px;z-index:100;overflow-x:auto}
.ntab{padding:13px 18px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .18s;letter-spacing:.05em;text-transform:uppercase;user-select:none;white-space:nowrap}
.ntab:hover{color:var(--blue);background:var(--bpale)}
.ntab.active{color:var(--navy);border-bottom-color:var(--yellow);font-weight:700}
.subnav{display:flex;gap:5px;margin-bottom:22px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:5px;width:fit-content;box-shadow:var(--sh)}
.stab{padding:7px 16px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:7px;transition:all .18s;letter-spacing:.04em;text-transform:uppercase;user-select:none}
.stab:hover{color:var(--navy);background:var(--bsoft)}
.stab.active{background:var(--navy);color:#fff}
.content{padding:24px 36px;max-width:1380px;margin:0 auto}
.tc{display:none}.tc.active{display:block}
.gc{border-radius:14px;padding:26px 28px;margin-bottom:22px;background:linear-gradient(135deg,#0D5C9B 0%,#1A7AC2 60%,#2E8FD4 100%);position:relative;overflow:hidden}
.gc::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.gc-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#A8D8F0;margin-bottom:2px}
.gc-period{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:18px}
.gc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.gm{background:rgba(255,255,255,.12);border-radius:9px;padding:15px 16px;border:1px solid rgba(255,255,255,.14)}
.gm-val{font-size:28px;font-weight:700;color:#fff;line-height:1}
.gm-val.y{color:var(--yellow)}
.gm-lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}
.gm-sub{font-size:11px;margin-top:3px;font-weight:500}
.sp{color:#86EFAC}.sn{color:#FCA5A5}.sm{color:#FDE68A}
.gc-insight{background:rgba(255,255,255,.1);border-radius:9px;padding:12px 16px;font-size:12px;color:rgba(255,255,255,.85);line-height:1.65;border-left:3px solid var(--yellow);margin-bottom:14px}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cpill{background:rgba(255,255,255,.1);border-radius:9px;padding:11px 14px;border:1px solid rgba(255,255,255,.12)}
.cpill-name{font-size:10px;font-weight:700;color:#A8D8F0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.cpill-stat{font-size:12px;color:rgba(255,255,255,.75)}
.cpill-bar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:7px;overflow:hidden}
.cpill-fill{height:100%;border-radius:2px;background:var(--yellow)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.kpi{background:var(--white);border-radius:var(--r);padding:16px 18px;border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:var(--sh)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.b::before{background:var(--blue)}.kpi.g::before{background:var(--green)}
.kpi.r::before{background:var(--red)}.kpi.y::before{background:var(--yellow)}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}
.kpi-val{font-size:30px;font-weight:700;color:var(--navy);line-height:1}
.kpi-sub{font-size:11px;margin-top:4px;font-weight:500}
.pos{color:var(--green)}.neg{color:var(--red)}.mid{color:var(--orange)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.charts-row.three{grid-template-columns:1fr 1fr 1fr}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;box-shadow:var(--sh)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--border2);font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.08em;background:var(--bxpal)}
.card-b{padding:14px 16px}
.donut-wrap{display:flex;align-items:center;gap:16px;padding:4px 0}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1}
.dl-row{display:flex;align-items:center;gap:8px;font-size:12px}
.dl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dl-label{color:var(--muted);flex:1}
.dl-val{color:var(--navy);font-weight:600}
.dl-pct{color:var(--muted2);font-size:10px;margin-left:2px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.br{display:flex;align-items:center;gap:10px}
.bl{font-size:11px;color:var(--text);flex-shrink:0}
.bt{flex:1;height:7px;background:var(--bpale);border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px}
.bv{font-size:11px;font-weight:700;color:var(--navy);min-width:26px;text-align:right}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.brand-name{font-size:12px;color:var(--text);min-width:130px;font-weight:500}
.brand-bar-t{flex:1;height:7px;background:var(--bpale);border-radius:4px;overflow:hidden}
.brand-bar-f{height:100%;border-radius:4px;background:var(--orange)}
.brand-val{font-size:11px;font-weight:700;color:var(--orange);min-width:22px;text-align:right}
.vis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vis-cell{background:var(--bpale);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border2)}
.vis-val{font-size:20px;font-weight:700}
.vis-lbl{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.al{list-style:none}
.ai{padding:8px 11px;border-radius:7px;margin-bottom:5px;font-size:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;border-left:3px solid}
.ai.c{background:var(--rsoft);border-color:var(--red);color:#7A1F1F}
.ai.w{background:var(--osoft);border-color:var(--orange);color:#7A3A08}
.ai.i{background:var(--bsoft);border-color:var(--blue);color:var(--navy)}
.ad{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ai.c .ad{background:var(--red)}.ai.w .ad{background:var(--orange)}.ai.i .ad{background:var(--blue)}
.fb{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.fl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.fs{border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--navy);background:var(--bxpal);font-family:'Inter',sans-serif;cursor:pointer}
.fs:focus{outline:none;border-color:var(--blue)}
.rc{font-size:11px;color:var(--muted);margin-left:auto;font-weight:500}
.tag{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tg{background:var(--gsoft);color:#145A35}.tr{background:var(--rsoft);color:#921F1F}
.to{background:var(--osoft);color:#994D08}.tgr{background:var(--bpale);color:var(--muted)}
.tb{background:var(--bsoft);color:#0D4A7A}.ty{background:var(--ysoft);color:#7A5500}
.lg{display:flex;flex-direction:column;gap:7px}
.lc{background:var(--white);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;transition:border-color .18s;box-shadow:var(--sh)}
.lc:hover{border-color:var(--blue-mid)}
.lh{padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;flex-wrap:wrap;transition:background .15s}
.lh:hover{background:var(--bxpal)}
.li{flex:1;min-width:140px}
.ln{font-size:13px;font-weight:600;color:var(--navy)}
.lci{font-size:11px;color:var(--muted);margin-top:2px}
.chv{font-size:11px;color:var(--muted2);transition:transform .18s;margin-left:auto;flex-shrink:0}
.chv.open{transform:rotate(180deg)}
.lb{padding:0 14px 14px;display:none}
.lb.open{display:block}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:9px 20px;border-top:1px solid var(--border2);padding-top:12px;margin-bottom:11px}
.dk{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.dv{font-size:12px;color:var(--navy);font-weight:500}
.obs{background:var(--ysoft);border-radius:7px;padding:9px 12px;font-size:12px;color:#5C4000;margin-bottom:11px;border-left:3px solid var(--yellow);line-height:1.6}
.pl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px;padding-top:8px;border-top:1px solid var(--border2)}
.pg{display:flex;gap:7px;flex-wrap:wrap}
.pt{width:108px;height:76px;border-radius:7px;object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s;background:var(--bpale)}
.pt:hover{transform:scale(1.05);box-shadow:0 4px 14px rgba(13,92,155,.18)}
.pp{width:108px;height:76px;border-radius:7px;background:var(--bxpal);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted2);text-align:center;padding:6px}
/* EVIDENCIAS */
.ev-type-subnav{display:flex;gap:5px;margin-bottom:18px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:5px;width:fit-content;box-shadow:var(--sh)}
.ev-day-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.ev-dtab{padding:7px 16px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:7px;border:1px solid var(--border);background:var(--white);transition:all .18s;user-select:none}
.ev-dtab:hover{background:var(--bsoft);color:var(--navy);border-color:var(--blue)}
.ev-dtab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.ev-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ev-title{font-size:14px;font-weight:600;color:var(--navy)}
.ev-subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.ev-open-btn{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;border:1px solid var(--border);padding:7px 16px;border-radius:7px;background:var(--white);transition:background .15s;display:inline-block}
.ev-open-btn:hover{background:var(--bsoft)}
.ev-iframe-wrap{border-radius:var(--r);overflow:hidden;border:1px solid var(--border);box-shadow:var(--sh)}
.ev-iframe-wrap iframe{width:100%;height:640px;border:none;display:block;background:var(--white)}
.ev-hint{margin-top:12px;padding:12px 16px;background:var(--bsoft);border-radius:8px;border:1px solid var(--border);font-size:12px;color:var(--navy);line-height:1.7}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(5,18,40,.92);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:10px;padding:16px}
.mo.open{display:flex}
.mo-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:min(860px,92vw)}
.mc{position:absolute;top:-14px;right:-14px;color:#fff;font-size:15px;cursor:pointer;background:rgba(255,255,255,.15);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;z-index:2}
.mc:hover{background:rgba(255,255,255,.28)}
.mo-frame{width:min(860px,92vw);height:min(600px,78vh);border:none;border-radius:9px;background:var(--bpale)}
.mo-nav{display:flex;align-items:center;gap:10px}
.mo-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;transition:background .15s}
.mo-btn:hover{background:rgba(255,255,255,.2)}
.mo-btn:disabled{opacity:.3;cursor:default}
.mo-info{font-size:11px;color:rgba(255,255,255,.5)}
.mo-local{font-size:13px;color:#A8D8F0;font-weight:600;max-width:500px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-ext{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#A8D8F0;text-decoration:none;border:1px solid rgba(168,216,240,.3);padding:5px 12px;border-radius:6px}
.mo-ext:hover{background:rgba(168,216,240,.1)}
.loader{text-align:center;padding:70px;color:var(--muted);font-size:13px}
.nodata{text-align:center;padding:50px;color:var(--muted);font-size:13px}
.sec-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
@media(max-width:960px){
  .kpi-grid,.gc-metrics,.city-grid{grid-template-columns:repeat(2,1fr)}
  .charts-row,.charts-row.three{grid-template-columns:1fr}
  .hdr,.nav,.content{padding-left:14px;padding-right:14px}
  .htitle{display:none}.dg{grid-template-columns:1fr}
}
@media(max-width:540px){
  .kpi-grid,.gc-metrics,.city-grid{grid-template-columns:1fr}
  .subnav,.ev-type-subnav{width:100%}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <img src="https://raw.githubusercontent.com/dmfadev/TABLERO-BF/main/logobancofamiliarblanco.jpg"
         class="logo" alt="Banco Familiar"
         onerror="this.style.display='none';document.getElementById('lfb').style.display='block'"/>
    <span id="lfb" class="logo-fb">BANCO FAMILIAR</span>

  </div>

</div>

<div class="nav">

</div>

<div class="content">

  <div id="tc-tiendas"    class="tc"><div class="loader">Cargando datos...</div></div>

      <button class="mo-btn" id="mo-prev" onclick="moNav(-1)">&#8592; Anterior</button>
      <a class="mo-ext" id="mo-ext" href="#" target="_blank">Abrir en Drive</a>
      <button class="mo-btn" id="mo-next" onclick="moNav(1)">Siguiente &#8594;</button>
    </div>
  </div>
</div>

<script>
const SHEET='1YrNdJ_Hf9AyrKm_MpO3FgyqLWs4x3iNRuQv9AfNpnok';
const GID={gastro_bf:'0',gastro_compe:'1005179077',tiendas:'1203279782'};

const DRIVE_FOLDERS={
  D1:{label:'Dia 1',bf:'10Po1vO3Hfz_YosEBxFanLYCOhzhcALAQ',comp:'1M_rfQeHLAdXCpPXoJjv_fK4TUMNrLfIf'},
  D2:{label:'Dia 2',bf:'1WO4KE51PJwIh-nu7MfL-4lLW3fO_jcI5', comp:'1hEGLKEo0HbS_zb7jfi21gRFzN8zAS2EF'},
  D3:{label:'Dia 3',bf:'1dQnd34VRXe7f3ieB4wfnfweUOJjFdUJ1', comp:'1StvcBAzdMzHJx7ECXM5DJvaNFkNlD0v6'},

};

const BF={FECHA:0,HORA:1,LOCAL:3,NOMBRE_ID:4,CIUDAD:5,TIPO_LOCAL:6,TIPO_MAT_ASIG:7,DIA_PROMO:8,BENEFICIO:9,HAY_MAT:10,TIPO_MAT:11,MAT_COL:12,CORRESPONDE:13,ESTADO_MAT:14,BEN_EXH:15,OFERTA:16,HAY_ANT:17,TIPO_ANT:18,CONOCE:19,ENCARGADO:20,OBS:21,ESTADO_ENVIO:22,F1:23,F2:24,F3:25,FAUS:26,FANT:27};

const DROP=new Set(['595 LOUNGE|Ciudad del Este|14:00:43','LA CAROLINA CAFE BISTRO|Ciudad del Este|15:13:43','BURGER KING VILLARRICA|Villarrica|16:31:21','BURGER KING VILLARRICA|Villarrica|16:32:39','BURGER KING 3 DE FEBRERO|Ciudad del Este|10:34:35','BURGER KING CORONEL OVIEDO|Coronel Oviedo|11:54:13','LA MADAME|Concepcion|19:36:07','MANSION IRIGOYEN|Concepcion|10:36:55']);

const isYes=v=>(v||'').toLowerCase().startsWith('s');
const trunc=(s,n)=>s&&s.length>n?s.slice(0,n)+'...':s;
function driveId(u){if(!u||!u.trim())return null;const m=(u+'').match(/\/d\/([a-zA-Z0-9_-]+)/)||(u+'').match(/[?&]id=([a-zA-Z0-9_-]+)/);return m?m[1]:null;}
const drvThumb=(u,sz='w320')=>{const id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=${sz}`:null;};
const drvEmbed=u=>{const id=driveId(u);return id?`https://drive.google.com/file/d/${id}/preview`:null;};
const drvView=u=>{const id=driveId(u);return id?`https://drive.google.com/file/d/${id}/view`:null;};

/* LIGHTBOX */
let _lb={urls:[],idx:0,local:''};
function openMO(urls,idx,local){_lb={urls,idx,local:local||''};_refreshMO();document.getElementById('modal').classList.add('open');}
function _refreshMO(){const u=_lb.urls[_lb.idx];document.getElementById('mo-frame').src=drvEmbed(u)||'';document.getElementById('mo-ext').href=drvView(u)||'#';document.getElementById('mo-local').textContent=_lb.local;document.getElementById('mo-info').textContent=`Foto ${_lb.idx+1} de ${_lb.urls.length}`;document.getElementById('mo-prev').disabled=_lb.idx===0;document.getElementById('mo-next').disabled=_lb.idx===_lb.urls.length-1;}
function moNav(d){_lb.idx=Math.max(0,Math.min(_lb.urls.length-1,_lb.idx+d));_refreshMO();}
function closeMO(e,force){if(force||(e&&e.target===document.getElementById('modal'))){document.getElementById('modal').classList.remove('open');document.getElementById('mo-frame').src='';}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMO(null,true);});

/* FOTO helpers */
function getRawURLs(r,cols){return cols.map(c=>r[c]).filter(u=>u&&u.trim());}
function photoBlock(rawUrls,localName,label){
  if(!rawUrls.length)return`<div class="pl">${label}</div><div class="pg"><div class="pp">Sin evidencia fotografica</div></div>`;
  const arr=JSON.stringify(rawUrls).replace(/"/g,'&quot;');
  const imgs=rawUrls.map((u,i)=>{
    const th=drvThumb(u);
    return th?`<img class="pt" src="${th}" alt="" loading="lazy"
      onclick="openMO(JSON.parse(this.dataset.u),${i},'${(localName||'').replace(/'/g,'')}')"
      data-u="${arr}" onerror="this.style.display='none'">`:'';
  }).join('');
  return`<div class="pl">${label}</div><div class="pg">${imgs}</div>`;
}

/* DONUT */
function makeSVGDonut(slices){
  const total=slices.reduce((s,x)=>s+x.v,0);
  if(!total)return'<svg width="120" height="120"></svg>';
  let off=0;const r=48,cx=60,cy=60,circ=2*Math.PI*r;let paths='';
  slices.forEach(s=>{const pct=s.v/total,dash=pct*circ,gap=circ-dash;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="13" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-off*circ).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" opacity=".9"/>`;
    off+=pct;});
  return`<svg width="120" height="120" viewBox="0 0 120 120">${paths}<text x="${cx}" y="${cy+6}" text-anchor="middle" font-family="Inter" font-size="19" font-weight="700" fill="#0B2A4A">${total}</text></svg>`;
}
function donutCard(id,slices){
  const el=document.getElementById(id);if(!el)return;
  const total=slices.reduce((s,x)=>s+x.v,0);
  const legend=slices.map(s=>`<div class="dl-row"><div class="dl-dot" style="background:${s.c}"></div><span class="dl-label">${s.l}</span><span class="dl-val">${s.v}</span><span class="dl-pct">${total?Math.round(s.v/total*100):0}%</span></div>`).join('');
  el.innerHTML=`<div class="donut-wrap">${makeSVGDonut(slices)}<div class="donut-legend">${legend}</div></div>`;
}

/* TAGS */
function matTagBF(r){return isYes(r[BF.HAY_MAT])?{c:'tg',l:'Con material'}:{c:'tr',l:'Sin material'}}
function estTagBF(r){const e=r[BF.ESTADO_MAT]||'';if(!e)return{c:'tgr',l:'--'};if(e.includes('perfecto'))return{c:'tg',l:'Buen estado'};if(e.includes('deteriorado'))return{c:'to',l:'Deteriorado'};if(e.includes('Poco visible')||e.includes('mal ubic'))return{c:'to',l:'Mal ubicado'};if(e.includes('No esta colocado'))return{c:'to',l:'No colocado'};if(e.includes('anterior'))return{c:'ty',l:'Camp. anterior'};if(e.includes('corresponde'))return{c:'tb',l:'Correcto'};return{c:'tgr',l:trunc(e,22)};}
function conoceTagBF(v){const s=(v||'').toLowerCase();if(s.includes('bien'))return{c:'tg',l:'Conoce promo'};if(s.includes('parcial'))return{c:'to',l:'Parcialmente'};if(s.includes('no la conoce'))return{c:'tr',l:'No conoce'};return{c:'tgr',l:'Sin encargado'};}
function visTag(v){const s=(v||'').toLowerCase();if(s.includes('mayor'))return{c:'tr',l:'Mayor que BF'};if(s.includes('similar'))return{c:'to',l:'Similar a BF'};if(s.includes('menor'))return{c:'tg',l:'Menor que BF'};return{c:'tgr',l:v||'--'};}

/* CSV */
function parseCSV(txt,skipRows){return txt.split('\n').slice(skipRows||2).map(line=>{const cols=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){inQ=!inQ}else if(ch===','&&!inQ){cols.push(cur.trim());cur=''}else cur+=ch;}cols.push(cur.trim());return cols;}).filter(r=>r.some(c=>c.trim()!==''));}
function dedupBF(rows){return rows.filter(r=>{const k=`${(r[BF.LOCAL]||'').trim()}|${(r[BF.CIUDAD]||'').trim()}|${(r[BF.HORA]||'').trim()}`;return!DROP.has(k);}).filter(r=>r[BF.LOCAL]&&r[BF.LOCAL].trim()!=='');}
function cleanCP(rows){return rows.filter(r=>r[CP.LOCAL]&&r[CP.LOCAL].trim()!=='');}

/* GLOBAL BANNER */
function buildGlobal(rows,period,isCompe,colLocal,colCiudad,colHayMat,colConoce){
  const total=rows.length,con=rows.filter(r=>isYes(r[colHayMat])).length,sin=total-con;
  const conoce=colConoce!=null?rows.filter(r=>(r[colConoce]||'').toLowerCase().includes('bien')).length:0;
  const pctCon=total?Math.round(con/total*100):0,pctKnow=total&&colConoce!=null?Math.round(conoce/total*100):0;
  const cityMap={};rows.forEach(r=>{const c=r[colCiudad]||'Sin ciudad';if(!cityMap[c])cityMap[c]={total:0,con:0};cityMap[c].total++;if(isYes(r[colHayMat]))cityMap[c].con++;});
  const cities=Object.entries(cityMap).sort((a,b)=>b[1].total-a[1].total).slice(0,6);
  const maxT=cities[0]?.[1].total||1;
  const best=[...cities].sort((a,b)=>(b[1].con/b[1].total)-(a[1].con/a[1].total))[0];
  const bestPct=best?Math.round(best[1].con/best[1].total*100):0;
  const insight=isCompe
    ?`${con} de ${total} locales presentan material activo de otras entidades.${best?` ${best[0]} concentra mayor presencia (${bestPct}%).`:''} Se recomienda refuerzo en puntos de mayor exposicion.`
    :`${con} de ${total} locales cuentan con material BF.${best?` ${best[0]} lidera con ${bestPct}% de cobertura.`:''} ${rows.filter(r=>isYes(r[colHayMat])&&(r[BF.ESTADO_MAT]||'').includes('perfecto')).length} locales con material en perfecto estado.`;
  const knowRow=colConoce!=null
    ?`<div class="gm"><div class="gm-val">${conoce}</div><div class="gm-lbl">Conocen la promo</div><div class="gm-sub ${pctKnow>=50?'sp':'sm'}">${pctKnow}%</div></div>`
    :`<div class="gm"><div class="gm-val y">${pctCon}%</div><div class="gm-lbl">Cobertura</div><div class="gm-sub sm">Con material</div></div>`;
  const cityHTML=cities.map(([name,st])=>{const pct=Math.round(st.con/st.total*100),bar=Math.round(st.total/maxT*100);
    return`<div class="cpill"><div class="cpill-name">${name}</div><div class="cpill-stat">${st.total} relevados &mdash; <strong>${pct}%</strong> con material</div><div class="cpill-bar"><div class="cpill-fill" style="width:${bar}%"></div></div></div>`;}).join('');
  return`<div class="gc"><div class="gc-lbl">${isCompe?'Analisis de Competencia':'Resumen Global'}</div><div class="gc-period">Periodo: ${period}</div>
    <div class="gc-metrics">
      <div class="gm"><div class="gm-val">${total}</div><div class="gm-lbl">Locales relevados</div><div class="gm-sub sm">${cities.length} ciudades</div></div>
      <div class="gm"><div class="gm-val y">${con}</div><div class="gm-lbl">${isCompe?'Con material comp.':'Con material BF'}</div><div class="gm-sub sp">${pctCon}%</div></div>
      ${knowRow}
      <div class="gm"><div class="gm-val">${sin}</div><div class="gm-lbl">${isCompe?'Sin material comp.':'Sin material BF'}</div><div class="gm-sub sn">${100-pctCon}%</div></div>
    </div>
    <div class="gc-insight">${insight}</div>
    <div class="city-grid">${cityHTML}</div></div>`;
}

/* KPIs */
function buildKPIs(rows,period){
  const total=rows.length,con=rows.filter(r=>isYes(r[BF.HAY_MAT])).length,sin=total-con;
  const conoce=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('bien')).length;
  const pct=v=>total?Math.round(v/total*100):0;
  return`<div class="kpi-grid">
    <div class="kpi b"><div class="kpi-lbl">Locales relevados</div><div class="kpi-val">${total}</div><div class="kpi-sub" style="color:var(--muted)">${period}</div></div>
    <div class="kpi g"><div class="kpi-lbl">Con material BF</div><div class="kpi-val">${con}</div><div class="kpi-sub pos">${pct(con)}%</div></div>
    <div class="kpi r"><div class="kpi-lbl">Sin material BF</div><div class="kpi-val">${sin}</div><div class="kpi-sub neg">${pct(sin)}%</div></div>
    <div class="kpi y"><div class="kpi-lbl">Conocen la promo</div><div class="kpi-val">${conoce}</div><div class="kpi-sub ${pct(conoce)>=50?'pos':'mid'}">${pct(conoce)}%</div></div>
  </div>`;
}

/* ALERTAS */
function buildAlerts(rows,colObs,colBen,colLocal){
  const seen=new Set(),al=[];const add=(t,x)=>{if(!seen.has(x)){seen.add(x);al.push({t,x});}};
  rows.forEach(r=>{const loc=r[colLocal]||'',obs=(r[colObs]||'').toLowerCase(),ben=(r[colBen]||'').toUpperCase();
    if(ben.includes('RETIRAR'))add('c',`${loc} - Beneficio marcado para retirar.`);
    if(obs.includes('cerrado definitivamente'))add('c',`${loc} - Local cerrado definitivamente.`);
    if(obs.includes('cerrado por temporada'))add('w',`${loc} - Cerrado por temporada baja.`);
    if(obs.includes('no se permite')||obs.includes('no se puede colocar'))add('w',`${loc} - No permite exhibir material.`);
    if(obs.includes('retir')&&!ben.includes('RETIRAR'))add('c',`${loc} - Material retirado.`);
    if(obs.includes('solicita')||obs.includes('pidi')||obs.includes('interesado'))add('i',`${loc} - Encargado solicita material BF.`);
    if(obs.includes('no hay acuerdo'))add('w',`${loc} - Sin acuerdo vigente con BF.`);
    if(obs.includes('nueva administraci'))add('i',`${loc} - Nueva administracion.`);
    if(obs.includes('local nuevo'))add('i',`${loc} - Local nuevo sin visita previa.`);
  });
  if(!al.length)return'<div style="font-size:12px;color:var(--muted)">Sin alertas criticas.</div>';
  return`<ul class="al">${al.slice(0,10).map(a=>`<li class="ai ${a.t}"><span class="ad"></span><span>${a.x}</span></li>`).join('')}</ul>`;
}

function cityDist(rows,col){const m={};rows.forEach(r=>{const c=r[col]||'Sin ciudad';m[c]=(m[c]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8);}
function matDistBF(rows){const m={};rows.forEach(r=>{if(isYes(r[BF.HAY_MAT])){const t=r[BF.TIPO_MAT]||'Sin especificar';m[t]=(m[t]||0)+1;}});const sin=rows.filter(r=>!isYes(r[BF.HAY_MAT])).length;if(sin>0)m['Sin material']=sin;return Object.entries(m).sort((a,b)=>b[1]-a[1]);}

/* FILTER */
function buildFilterBar(rows,uid,colCiudad,colTipo){
  const cities=[...new Set(rows.map(r=>r[colCiudad]).filter(Boolean))].sort();
  const tipos=colTipo!=null?[...new Set(rows.map(r=>r[colTipo]).filter(Boolean))].sort():[];
  return`<div class="fb"><span class="fl">Filtrar</span>
    <select class="fs" id="fc-${uid}" onchange="applyF('${uid}')"><option value="">Todas las ciudades</option>${cities.map(c=>`<option>${c}</option>`).join('')}</select>
    ${tipos.length?`<select class="fs" id="ft-${uid}" onchange="applyF('${uid}')"><option value="">Todos los tipos</option>${tipos.map(t=>`<option>${t}</option>`).join('')}</select>`:''}
    <span class="rc" id="rc-${uid}">${rows.length} locales</span></div>`;
}
function applyF(uid){
  const ciudad=document.getElementById(`fc-${uid}`)?.value||'',tipo=document.getElementById(`ft-${uid}`)?.value||'';
  const meta=_all[uid]?.meta||{};
  _filt[uid].rows=(_all[uid]?.rows||[]).filter(r=>{if(ciudad&&r[meta.colCiudad]!==ciudad)return false;if(tipo&&r[meta.colTipo]!==tipo)return false;return true;});
  const rc=document.getElementById(`rc-${uid}`);if(rc)rc.textContent=`${_filt[uid].rows.length} locales`;
  const lc=document.getElementById(`lc-${uid}`);if(lc&&meta.renderer)lc.innerHTML=meta.renderer(_filt[uid].rows,uid);
}
function storeAndRender(uid,rows,colCiudad,colTipo,renderer){_all[uid]={rows,meta:{colCiudad,colTipo,renderer}};_filt[uid]={rows:[...rows]};}

/* ANALISIS COMPETENCIA GASTRO */

  const brands=Object.entries(brandMap).sort((a,b)=>b[1]-a[1]).slice(0,8),maxB=brands[0]?.[1]||1;
  const mayor=rows.filter(r=>(r[CP.VISIBILIDAD]||'').toLowerCase().includes('mayor')).length;

      ${brands.map(([b,v])=>`<div class="brand-row"><span class="brand-name">${b}</span><div class="brand-bar-t"><div class="brand-bar-f" style="width:${Math.round(v/maxB*100)}%"></div></div><span class="brand-val">${v}</span></div>`).join('')||'<div style="color:var(--muted);font-size:12px">Sin marcas.</div>'}
    </div></div>

        <div class="vis-cell"><div class="vis-val" style="color:var(--green)">${menor}</div><div class="vis-lbl">Menor que BF</div></div>
      </div>
    </div></div>
  </div>`;
}

/* BUILD GASTRO BF */
function buildGastroBF(rows){
  const uid='g-bf';storeAndRender(uid,rows,BF.CIUDAD,BF.TIPO_LOCAL,buildLocalesBF);
  const cd=cityDist(rows,BF.CIUDAD),md=matDistBF(rows),cmx=cd[0]?.[1]||1,mmx=Math.max(...md.map(x=>x[1]),1);
  const con=rows.filter(r=>isYes(r[BF.HAY_MAT])).length,sin=rows.length-con;
  const cBien=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('bien')).length;
  const cParc=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('parcial')).length;
  const cNo=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('no la conoce')).length;
  const cSin=rows.length-cBien-cParc-cNo;
  const ePer=rows.filter(r=>(r[BF.ESTADO_MAT]||'').includes('perfecto')).length;
  const eDet=rows.filter(r=>(r[BF.ESTADO_MAT]||'').includes('deteriorado')).length;
  const eCam=rows.filter(r=>(r[BF.ESTADO_MAT]||'').includes('anterior')).length;
  const eOtr=con-ePer-eDet-eCam;
  const html=`
    ${buildGlobal(rows,PERIOD.gastro,false,BF.LOCAL,BF.CIUDAD,BF.HAY_MAT,BF.CONOCE)}
    ${buildKPIs(rows,PERIOD.gastro)}
    <div class="charts-row three">
      <div class="card"><div class="card-h">Presencia de material</div><div class="card-b" id="dnt-mat-bf"></div></div>
      <div class="card"><div class="card-h">Conocimiento de la promocion</div><div class="card-b" id="dnt-con-bf"></div></div>
      <div class="card"><div class="card-h">Estado del material</div><div class="card-b" id="dnt-est-bf"></div></div>
    </div>
    <div class="charts-row">
      <div class="card"><div class="card-h">Locales por ciudad</div><div class="card-b">${barRows(cd,cmx,'var(--blue)',130)}</div></div>
      <div class="card"><div class="card-h">Alertas y hallazgos</div><div class="card-b">${buildAlerts(rows,BF.OBS,BF.BENEFICIO,BF.LOCAL)}</div></div>
    </div>
    <div class="charts-row" style="grid-template-columns:1fr">
      <div class="card"><div class="card-h">Tipo de material colocado</div><div class="card-b">${barRows(md,mmx,'var(--blue)',170)}</div></div>
    </div>
    <div class="sec-lbl">Detalle por local</div>
    ${buildFilterBar(rows,uid,BF.CIUDAD,BF.TIPO_LOCAL)}
    <div class="lg" id="lc-${uid}">${buildLocalesBF(rows,uid)}</div>`;
  setTimeout(()=>{
    donutCard('dnt-mat-bf',[{l:'Con material',v:con,c:'#1A7A4A'},{l:'Sin material',v:sin,c:'#B03A2E'}]);
    donutCard('dnt-con-bf',[{l:'La conoce bien',v:cBien,c:'#1A7A4A'},{l:'Parcialmente',v:cParc,c:'#C0600A'},{l:'No la conoce',v:cNo,c:'#B03A2E'},{l:'Sin encargado',v:cSin,c:'#7EB3D4'}].filter(x=>x.v>0));
    donutCard('dnt-est-bf',[{l:'Perfecto estado',v:ePer,c:'#1A7A4A'},{l:'Deteriorado',v:eDet,c:'#C0600A'},{l:'Camp. anterior',v:eCam,c:'#F5A800'},{l:'Otro',v:eOtr,c:'#2E8FD4'}].filter(x=>x.v>0));
  },50);return html;
}

/* BUILD GASTRO COMP */
function buildGastroCompe(rows){
  const uid='g-cp';storeAndRender(uid,rows,CP.CIUDAD,CP.TIPO_LOCAL,buildLocalesCP);
  const cd=cityDist(rows,CP.CIUDAD),cmx=cd[0]?.[1]||1;
  const conC=rows.filter(r=>isYes(r[CP.HAY_MAT])).length,sinC=rows.length-conC;
  const conP=rows.filter(r=>isYes(r[CP.HAY_PROMO])).length,sinP=rows.length-conP;
  const html=`
    ${buildGlobal(rows,PERIOD.gastro,true,CP.LOCAL,CP.CIUDAD,CP.HAY_MAT,null)}
    <div class="charts-row">
      <div class="card"><div class="card-h">Presencia material competencia</div><div class="card-b" id="dnt-cp-mat"></div></div>
      <div class="card"><div class="card-h">Promo activa de competencia</div><div class="card-b" id="dnt-cp-pro"></div></div>
    </div>
    ${buildCompeAnalysis(rows)}
    <div class="charts-row" style="grid-template-columns:1fr">
      <div class="card"><div class="card-h">Locales por ciudad</div><div class="card-b">${barRows(cd,cmx,'var(--orange)',130)}</div></div>
    </div>
    <div class="sec-lbl">Detalle por local</div>
    ${buildFilterBar(rows,uid,CP.CIUDAD,CP.TIPO_LOCAL)}
    <div class="lg" id="lc-${uid}">${buildLocalesCP(rows,uid)}</div>`;
  setTimeout(()=>{
    donutCard('dnt-cp-mat',[{l:'Con material comp.',v:conC,c:'#B03A2E'},{l:'Sin material comp.',v:sinC,c:'#1A7A4A'}]);
    donutCard('dnt-cp-pro',[{l:'Con promo activa',v:conP,c:'#C0600A'},{l:'Sin promo',v:sinP,c:'#2E8FD4'}]);
  },50);return html;
}

/* BUILD TIENDAS */
function buildTiendasBF(rows){
  const uid='t-bf';storeAndRender(uid,rows,TI.FECHA,null,r=>buildLocalesTI(r,uid,false));
  const total=rows.length,con=rows.filter(r=>isYes(r[TI.MUESTRA_PROMO])).length,conC=rows.filter(r=>isYes(r[TI.CONOCE])).length;
  const pct=total?Math.round(con/total*100):0;
  const html=`<div class="gc"><div class="gc-lbl">Resumen Global — Tiendas</div><div class="gc-period">Periodo: ${PERIOD.tiendas}</div>
    <div class="gc-metrics">
      <div class="gm"><div class="gm-val">${total}</div><div class="gm-lbl">Locales relevados</div><div class="gm-sub sm">Tiendas</div></div>
      <div class="gm"><div class="gm-val y">${con}</div><div class="gm-lbl">Muestran promo BF</div><div class="gm-sub sp">${pct}%</div></div>
      <div class="gm"><div class="gm-val">${total-con}</div><div class="gm-lbl">Sin promo exhibida</div><div class="gm-sub sn">${100-pct}%</div></div>
      <div class="gm"><div class="gm-val y">${conC}</div><div class="gm-lbl">Conocen la promo</div><div class="gm-sub sm">Encargados</div></div>
    </div></div>
    <div class="charts-row">
      <div class="card"><div class="card-h">Exhibicion de promo</div><div class="card-b" id="dnt-ti-pr"></div></div>
      <div class="card"><div class="card-h">Conocimiento de la promo</div><div class="card-b" id="dnt-ti-co"></div></div>
    </div>
    <div class="sec-lbl">Detalle por local</div>
    ${buildFilterBar(rows,uid,TI.FECHA,null)}
    <div class="lg" id="lc-${uid}">${buildLocalesTI(rows,uid,false)}</div>`;
  setTimeout(()=>{
    donutCard('dnt-ti-pr',[{l:'Muestra promo',v:con,c:'#1A7A4A'},{l:'Sin promo',v:total-con,c:'#B03A2E'}]);
    donutCard('dnt-ti-co',[{l:'Conoce promo',v:conC,c:'#1A7A4A'},{l:'No / N-D',v:total-conC,c:'#C0600A'}]);
  },50);return html;
}

function buildTiendasCompe(rows){
  const uid='t-cp';const wC=rows.filter(r=>(r[TI.MAT_COMP]||'').trim()!=='');
  storeAndRender(uid,wC,TI.FECHA,null,r=>buildLocalesTI(r,uid,true));
  const total=rows.length,con=wC.length,pct=total?Math.round(con/total*100):0;
  const brandMap={};wC.forEach(r=>(r[TI.MAT_COMP]||'').split(/[,;]/).forEach(b=>{const bk=b.trim();if(bk)brandMap[bk]=(brandMap[bk]||0)+1;}));
  const brands=Object.entries(brandMap).sort((a,b)=>b[1]-a[1]).slice(0,6),maxB=brands[0]?.[1]||1;
  const html=`<div class="gc"><div class="gc-lbl">Analisis de Competencia — Tiendas</div><div class="gc-period">Periodo: ${PERIOD.tiendas}</div>
    <div class="gc-metrics">
      <div class="gm"><div class="gm-val">${total}</div><div class="gm-lbl">Locales relevados</div><div class="gm-sub sm">Total</div></div>
      <div class="gm"><div class="gm-val y">${con}</div><div class="gm-lbl">Con material comp.</div><div class="gm-sub sn">${pct}%</div></div>
      <div class="gm"><div class="gm-val">${total-con}</div><div class="gm-lbl">Sin material comp.</div><div class="gm-sub sp">${100-pct}%</div></div>
      <div class="gm"><div class="gm-val">${rows.filter(r=>isYes(r[TI.PROMO_COMP])).length}</div><div class="gm-lbl">Promo activa comp.</div><div class="gm-sub sm">Exhibida</div></div>
    </div></div>
    <div class="charts-row">
      <div class="card"><div class="card-h">Bancos competidores en tiendas</div><div class="card-b">
        ${brands.map(([b,v])=>`<div class="brand-row"><span class="brand-name">${b}</span><div class="brand-bar-t"><div class="brand-bar-f" style="width:${Math.round(v/maxB*100)}%"></div></div><span class="brand-val">${v}</span></div>`).join('')||'<div style="color:var(--muted);font-size:12px">Sin datos.</div>'}
      </div></div>
      <div class="card"><div class="card-h">Presencia competencia</div><div class="card-b" id="dnt-ticp"></div></div>
    </div>
    <div class="sec-lbl">Locales con material de competencia</div>
    ${buildFilterBar(wC,uid,TI.FECHA,null)}
    <div class="lg" id="lc-${uid}">${buildLocalesTI(wC,uid,true)}</div>`;
  setTimeout(()=>{donutCard('dnt-ticp',[{l:'Con competencia',v:con,c:'#B03A2E'},{l:'Sin competencia',v:total-con,c:'#1A7A4A'}]);},50);
  return html;
}

/* TAB BUILDERS */
function buildTabGastro(bfRows,compeRows){
  document.getElementById('pbadge').textContent=PERIOD.gastro;
  const sub=`<div class="subnav" id="sn-g"><div class="stab active" onclick="switchSub('g','bf')">Banco Familiar</div><div class="stab" onclick="switchSub('g','cp')">Competencia</div></div>`;
  document.getElementById('tc-gastro').innerHTML=sub+`<div id="sub-g-bf">${buildGastroBF(bfRows)}</div><div id="sub-g-cp" style="display:none">${buildGastroCompe(compeRows)}</div>`;
}
function buildTabTiendas(rows){
  document.getElementById('pbadge').textContent=PERIOD.tiendas;
  const sub=`<div class="subnav" id="sn-t"><div class="stab active" onclick="switchSub('t','bf')">Banco Familiar</div><div class="stab" onclick="switchSub('t','cp')">Competencia</div></div>`;
  document.getElementById('tc-tiendas').innerHTML=sub+`<div id="sub-t-bf">${buildTiendasBF(rows)}</div><div id="sub-t-cp" style="display:none">${buildTiendasCompe(rows)}</div>`;
}

/* EVIDENCIAS FOTOGRAFICAS */
let _evType='bf',_evDay='D1';
function buildTabEvidencias(){
  const el=document.getElementById('tc-evidencias');
  el.innerHTML=`
    <div class="ev-type-subnav" id="sn-ev">
      <div class="stab active" onclick="switchEvType('bf')">Material Banco Familiar</div>
      <div class="stab" onclick="switchEvType('comp')">Material Competencia</div>
    </div>
    <div class="ev-day-tabs" id="ev-day-tabs">
      ${Object.entries(DRIVE_FOLDERS).map(([k,f],i)=>`<div class="ev-dtab ${i===0?'active':''}" onclick="switchEvDay('${k}')">${f.label}</div>`).join('')}
    </div>
    <div id="ev-content"></div>`;
  renderEvFolder();
}
function switchEvType(type){
  _evType=type;
  document.querySelectorAll('#sn-ev .stab').forEach((t,i)=>t.classList.toggle('active',(type==='bf'&&i===0)||(type==='comp'&&i===1)));
  renderEvFolder();
}
function switchEvDay(day){
  _evDay=day;
  document.querySelectorAll('.ev-dtab').forEach((t,i)=>t.classList.toggle('active',Object.keys(DRIVE_FOLDERS)[i]===day));
  renderEvFolder();
}
function renderEvFolder(){
  const el=document.getElementById('ev-content');if(!el)return;
  const folder=DRIVE_FOLDERS[_evDay];
  const folderId=_evType==='bf'?folder.bf:folder.comp;
  const typeLabel=_evType==='bf'?'Material Banco Familiar':'Material Competencia';
  const folderUrl=`https://drive.google.com/drive/folders/${folderId}`;
  el.innerHTML=`
    <div class="ev-header">
      <div>
        <div class="ev-title">${folder.label} &mdash; ${typeLabel}</div>
        <div class="ev-subtitle">Las fotos estan organizadas con el nombre del local como identificacion.</div>
      </div>
      <a href="${folderUrl}" target="_blank" class="ev-open-btn">Abrir carpeta en Drive</a>
    </div>
    <div class="ev-iframe-wrap">
      <iframe src="https://drive.google.com/embeddedfolderview?id=${folderId}#grid" allowfullscreen loading="lazy"></iframe>
    </div>
    <div class="ev-hint">
      <strong>Como usar:</strong> Cada imagen tiene el nombre del local visitado como identificacion. Haz clic en cualquier foto para verla completa en Google Drive. Usa los botones de Dia y el selector de tipo para navegar entre todos los dias y categorias de materiales.
    </div>`;
}

/* NAV */
function switchSub(tabKey,sub){
  document.querySelectorAll(`#sn-${tabKey} .stab`).forEach((t,i)=>t.classList.toggle('active',(sub==='bf'&&i===0)||(sub==='cp'&&i===1)));
  document.getElementById(`sub-${tabKey}-bf`).style.display=sub==='bf'?'':'none';
  document.getElementById(`sub-${tabKey}-cp`).style.display=sub==='cp'?'':'none';
}
function tog(bId,cId){const b=document.getElementById(bId),c=document.getElementById(cId);if(!b)return;const o=b.classList.toggle('open');if(c)c.classList.toggle('open',o);}

/* FETCH */
async function fetchCSV(gid,skip){const url=`https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv&gid=${gid}`;const res=await fetch(url);if(!res.ok)throw new Error(`HTTP ${res.status}`);return parseCSV(await res.text(),skip||2);}
async function loadGastro(){try{const[rawBF,rawCP]=await Promise.all([fetchCSV(GID.gastro_bf),fetchCSV(GID.gastro_compe)]);buildTabGastro(dedupBF(rawBF),cleanCP(rawCP));}catch(e){document.getElementById('tc-gastro').innerHTML=`<div class="nodata">Error: ${e.message}</div>`;}}
async function loadTiendas(){try{const rows=await fetchCSV(GID.tiendas,1);buildTabTiendas(rows.filter(r=>r[TI.LOCAL]&&r[TI.LOCAL].trim()!==''));}catch(e){document.getElementById('tc-tiendas').innerHTML=`<div class="nodata">Error: ${e.message}</div>`;}}

let _loaded={gastro:false,tiendas:false,evidencias:false};
function switchTab(tab){
  document.querySelectorAll('.ntab').forEach((t,i)=>t.classList.toggle('active',['gastro','tiendas','evidencias'][i]===tab));
  document.querySelectorAll('.tc').forEach((t,i)=>t.classList.toggle('active',['gastro','tiendas','evidencias'][i]===tab));
  document.getElementById('pbadge').textContent=tab==='gastro'?PERIOD.gastro:tab==='tiendas'?PERIOD.tiendas:'Mayo 2026';
  if(!_loaded[tab]){_loaded[tab]=true;if(tab==='gastro')loadGastro();else if(tab==='tiendas')loadTiendas();else buildTabEvidencias();}
}
_loaded.gastro=true;loadGastro();
</script>
