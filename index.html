<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Tablero de Relevamiento — Banco Familiar</title>
<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/dmfadev/TABLERO-BF/main/logoBancoFamiliar.webp"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A6B;--blue:#2D5FA6;--bsoft:#EBF2FA;
  --yellow:#F5A800;--ysoft:#FFF8E6;
  --white:#FFFFFF;--bg:#F4F7FB;--border:#E2E8F2;
  --text:#2C3E60;--muted:#7B8FB0;
  --green:#1A7A4A;--gsoft:#E8F5EE;
  --red:#B03A2E;--rsoft:#FCEAE8;
  --orange:#C0600A;--osoft:#FEF3E6;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* HEADER */
.hdr{background:var(--white);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:72px;border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(27,58,107,.07);position:sticky;top:0;z-index:200}
.hdr-l{display:flex;align-items:center;gap:20px}
.logo{height:56px}
.logo-fb{color:var(--navy);font-weight:700;font-size:16px;display:none}
.hdiv{width:1px;height:34px;background:var(--border)}
.htitle{color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase}
.pbadge{background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:6px 16px;border-radius:20px}

/* NAV */
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 40px;display:flex;gap:4px;position:sticky;top:68px;z-index:100}
.ntab{padding:14px 20px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;letter-spacing:.04em;text-transform:uppercase;margin-bottom:-1px;user-select:none}
.ntab:hover{color:var(--blue);background:var(--bsoft)}
.ntab.active{color:var(--navy);border-bottom-color:var(--yellow);font-weight:700;background:transparent}

/* SUBNAV */
.subnav{display:flex;gap:6px;margin-bottom:24px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:6px;width:fit-content}
.stab{padding:8px 18px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:7px;transition:all .2s;letter-spacing:.04em;text-transform:uppercase;user-select:none}
.stab:hover{color:var(--navy);background:var(--bsoft)}
.stab.active{background:var(--navy);color:#fff}

/* CONTENT */
.content{padding:28px 40px;max-width:1400px;margin:0 auto}
.tc{display:none}.tc.active{display:block}

/* GLOBAL CARD */
.gc{border-radius:14px;padding:30px 32px;margin-bottom:28px;position:relative;overflow:hidden;background:linear-gradient(135deg,#1B3A6B 0%,#2D5FA6 100%)}
.gc-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);margin-bottom:4px}
.gc-period{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:22px}
.gc-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.gm{background:rgba(255,255,255,.1);border-radius:10px;padding:16px 18px;border:1px solid rgba(255,255,255,.12)}
.gm-val{font-size:30px;font-weight:700;color:#fff;line-height:1}
.gm-val.y{color:var(--yellow)}
.gm-lbl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.gm-sub{font-size:11px;margin-top:4px;font-weight:500}
.sp{color:#86EFAC}.sn{color:#FCA5A5}.sm{color:#FCD34D}
.gc-insight{background:rgba(255,255,255,.08);border-radius:10px;padding:14px 18px;font-size:13px;color:rgba(255,255,255,.85);line-height:1.65;border-left:3px solid var(--yellow);margin-bottom:18px}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cpill{background:rgba(255,255,255,.08);border-radius:10px;padding:13px 16px;border:1px solid rgba(255,255,255,.1)}
.cpill-name{font-size:10px;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.cpill-stat{font-size:12px;color:rgba(255,255,255,.72)}
.cpill-bar{height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:9px;overflow:hidden}
.cpill-fill{height:100%;border-radius:2px;background:var(--yellow)}

/* TOP LOCALES */
.sec-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.top-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.top-card{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:box-shadow .2s,transform .15s}
.top-card:hover{box-shadow:0 8px 28px rgba(27,58,107,.13);transform:translateY(-2px)}
.top-img{width:100%;height:130px;object-fit:cover;display:block;background:var(--bg)}
.top-ph{width:100%;height:130px;background:var(--bsoft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.top-info{padding:13px 15px}
.top-name{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px}
.top-city{font-size:11px;color:var(--muted);margin-bottom:9px}
.top-tags{display:flex;gap:5px;flex-wrap:wrap}

/* COMPETENCIA CARD */
.compe-summary{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.compe-brands{background:var(--white);border-radius:12px;border:1px solid var(--border);padding:18px 20px}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.brand-name{font-size:12px;color:var(--text);min-width:140px;font-weight:500}
.brand-bar-t{flex:1;height:7px;background:var(--bg);border-radius:3px;overflow:hidden}
.brand-bar-f{height:100%;border-radius:3px;background:#C0600A}
.brand-val{font-size:11px;font-weight:700;color:var(--orange);min-width:24px;text-align:right}
.vis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.vis-cell{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
.vis-val{font-size:20px;font-weight:700;color:var(--navy)}
.vis-lbl{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--white);border-radius:12px;padding:18px 20px;border:1px solid var(--border);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0}
.kpi.b::before{background:var(--blue)}.kpi.g::before{background:var(--green)}
.kpi.r::before{background:var(--red)}.kpi.y::before{background:var(--yellow)}
.kpi-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px}
.kpi-val{font-size:32px;font-weight:700;color:var(--navy);line-height:1}
.kpi-sub{font-size:11px;margin-top:6px;font-weight:500}
.pos{color:var(--green)}.neg{color:var(--red)}.mid{color:var(--orange)}

/* TWO COL */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden}
.card-h{padding:13px 18px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.08em}
.card-b{padding:16px 18px}
.br{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bl{font-size:11px;color:var(--text);flex-shrink:0}
.bt{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bf{height:100%;border-radius:3px}
.bv{font-size:11px;font-weight:700;color:var(--navy);min-width:24px;text-align:right}

/* ALERTS */
.al{list-style:none}
.ai{padding:9px 12px;border-radius:8px;margin-bottom:6px;font-size:12px;display:flex;align-items:flex-start;gap:8px;line-height:1.5;border-left:3px solid}
.ai.c{background:var(--rsoft);border-color:var(--red);color:#7A1F1F}
.ai.w{background:var(--osoft);border-color:var(--orange);color:#7A3A08}
.ai.i{background:var(--bsoft);border-color:var(--blue);color:#1B3A6B}
.ad{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ai.c .ad{background:var(--red)}.ai.w .ad{background:var(--orange)}.ai.i .ad{background:var(--blue)}

/* FILTER */
.fb{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.fs{border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:11px;color:var(--navy);background:var(--bg);font-family:'Inter',sans-serif;cursor:pointer}
.fs:focus{outline:none;border-color:var(--blue)}
.rc{font-size:11px;color:var(--muted);margin-left:auto;font-weight:500}

/* TAGS */
.tag{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tg{background:var(--gsoft);color:#145A35}.tr{background:var(--rsoft);color:#921F1F}
.to{background:var(--osoft);color:#994D08}.tgr{background:var(--bg);color:var(--muted)}
.tb{background:var(--bsoft);color:#1B3A6B}.ty{background:var(--ysoft);color:#7A5500}

/* LOCAL CARDS */
.lg{display:flex;flex-direction:column;gap:8px}
.lc{background:var(--white);border-radius:12px;border:1px solid var(--border);overflow:hidden;transition:border-color .2s}
.lc:hover{border-color:#B8CCE8}
.lh{padding:13px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap;transition:background .15s}
.lh:hover{background:var(--bg)}
.li{flex:1;min-width:160px}
.ln{font-size:13px;font-weight:600;color:var(--navy)}
.lci{font-size:11px;color:var(--muted);margin-top:2px}
.chv{font-size:11px;color:var(--muted);transition:transform .2s;margin-left:auto;flex-shrink:0}
.chv.open{transform:rotate(180deg)}
.lb{padding:0 16px 16px;display:none}
.lb.open{display:block}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;border-top:1px solid var(--border);padding-top:14px;margin-bottom:12px}
.dk{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.dv{font-size:12px;color:var(--navy);font-weight:500}
.obs{background:var(--ysoft);border-radius:8px;padding:10px 13px;font-size:12px;color:#5C4000;margin-bottom:13px;border-left:3px solid var(--yellow);line-height:1.6}
.pl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px}
.pg{display:flex;gap:8px;flex-wrap:wrap}
.pt{width:110px;height:78px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;transition:transform .15s}
.pt:hover{transform:scale(1.05)}
.pp{width:110px;height:78px;border-radius:8px;background:var(--bg);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-align:center;padding:6px}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(5,15,35,.9);display:none;align-items:center;justify-content:center;z-index:9999}
.mo.open{display:flex}
.mi{max-width:90vw;max-height:88vh;border-radius:10px;object-fit:contain}
.mc{position:fixed;top:16px;right:20px;color:#fff;font-size:20px;cursor:pointer;background:rgba(255,255,255,.15);border:none;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.mc:hover{background:rgba(255,255,255,.25)}
.loader{text-align:center;padding:80px;color:var(--muted);font-size:14px}
.nodata{text-align:center;padding:60px;color:var(--muted);font-size:14px}

@media(max-width:960px){
  .kpi-grid,.gc-metrics,.top-grid,.city-grid,.compe-summary{grid-template-columns:repeat(2,1fr)}
  .two-col{grid-template-columns:1fr}
  .hdr,.nav,.content{padding-left:16px;padding-right:16px}
  .htitle{display:none}.dg{grid-template-columns:1fr}
}
@media(max-width:540px){
  .kpi-grid,.gc-metrics,.top-grid,.city-grid{grid-template-columns:1fr}
  .subnav{width:100%}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-l">
    <img src="https://raw.githubusercontent.com/dmfadev/TABLERO-BF/main/logobancofamiliarblanco.jpg"
         class="logo" alt="Banco Familiar"
         onerror="this.style.display='none';document.getElementById('lfb').style.display='block'"/>
    <span id="lfb" class="logo-fb">BANCO FAMILIAR</span>
    <div class="hdiv"></div>
    <span class="htitle">Tablero de Relevamiento de Materiales</span>
  </div>
  <div id="pbadge" class="pbadge">—</div>
</div>

<div class="nav">
  <div class="ntab active" onclick="switchTab('gastro')">Relevamiento Gastronómico</div>
  <div class="ntab" onclick="switchTab('tiendas')">Relevamiento Tiendas</div>
</div>

<div class="content">
  <div id="tc-gastro" class="tc active"><div class="loader">Cargando datos...</div></div>
  <div id="tc-tiendas" class="tc"><div class="loader">Cargando datos...</div></div>
</div>

<div class="mo" id="modal" onclick="closeModal(event)">
  <button class="mc" onclick="closeModal(null,true)">✕</button>
  <img class="mi" id="mimg" src="" alt="Evidencia fotográfica"/>
</div>

<script>
const SHEET = '1YrNdJ_Hf9AyrKm_MpO3FgyqLWs4x3iNRuQv9AfNpnok';

// GIDs de cada hoja
const GID = { gastro_bf:'0', gastro_compe:'1005179077', tiendas:'1203279782' };

// Períodos oficiales por relevamiento
const PERIOD = { gastro:'20 al 25 de mayo 2026', tiendas:'11 al 13 de mayo 2026' };

// ── COLUMNAS HOJA 1: BF GASTRO (gid=0) ──────────────────────
// FECHA HORA FISCALIZADOR LOCAL NOMBRE_ID CIUDAD TIPO_LOCAL TIPO_MAT_ASIG DIA_PROMO BENEFICIO
// HAY_MAT TIPO_MAT MAT_COL CORRESPONDE ESTADO_MAT BEN_EXH OFERTA HAY_ANT TIPO_ANT CONOCE
// ENCARGADO OBS ESTADO_ENVIO F1 F2 F3 FAUS FANT
const BF = {
  FECHA:0,HORA:1,LOCAL:3,NOMBRE_ID:4,CIUDAD:5,TIPO_LOCAL:6,
  TIPO_MAT_ASIG:7,DIA_PROMO:8,BENEFICIO:9,
  HAY_MAT:10,TIPO_MAT:11,MAT_COL:12,CORRESPONDE:13,ESTADO_MAT:14,
  BEN_EXH:15,OFERTA:16,HAY_ANT:17,TIPO_ANT:18,
  CONOCE:19,ENCARGADO:20,OBS:21,ESTADO_ENVIO:22,
  F1:23,F2:24,F3:25,FAUS:26,FANT:27
};

// ── COLUMNAS HOJA 2: COMPETENCIA GASTRO (gid=1005179077) ────
// FECHA HORA FISCALIZADOR LOCAL CIUDAD TIPO_LOCAL
// HAY_MAT_COMP MARCAS VISIBILIDAD HAY_PROMO TIPO_PROMO OBS_PROMO MOTIVO_SIN_FOTO
// FOTO_C1 FOTO_C2 FOTO_C3
const CP = {
  FECHA:0,HORA:1,LOCAL:3,CIUDAD:4,TIPO_LOCAL:5,
  HAY_MAT:6,MARCAS:7,VISIBILIDAD:8,
  HAY_PROMO:9,TIPO_PROMO:10,OBS_PROMO:11,MOTIVO_SIN_FOTO:12,
  F1:13,F2:14,F3:15
};

// ── COLUMNAS HOJA 3: TIENDAS (gid=1203279782) ───────────────
// FECHA HORA AUDITOR LOCAL MAT_ENCONTRADO OTRO_MAT_BF ESTADO_MAT MUESTRA_PROMO
// BENEFICIO_INDICADO MAT_CAMP_ANT
// FOTO_BF1..6  FOTO_ANT1..6
// MAT_COMPETENCIA PROMO_OTRA_ENTIDAD
// FOTO_COMP1..6
// ENCARGADO_CONOCE_PROMO OBS OBS_NO_FOTO_COMP OBS_OTRO_MAT
const TI = {
  FECHA:0,HORA:1,LOCAL:3,CIUDAD:3, // ciudad no hay col separada, usamos LOCAL
  MAT_ENC:4,OTRO_MAT:5,ESTADO_MAT:6,MUESTRA_PROMO:7,
  BENEFICIO:8,MAT_ANT:9,
  F1:10,F2:11,F3:12,F4:13,F5:14,F6:15,
  FANT1:16,FANT2:17,FANT3:18,
  MAT_COMP:22,PROMO_COMP:23,
  FC1:24,FC2:25,FC3:26,
  CONOCE:30,OBS:31,OBS_COMP:32,OBS_OTRO:33
};

// Duplicados gastro BF — conservar más reciente
const DROP = new Set([
  '595 LOUNGE|Ciudad del Este|14:00:43',
  'LA CAROLINA CAFE BISTRO|Ciudad del Este|15:13:43',
  'BURGER KING VILLARRICA|Villarrica|16:31:21',
  'BURGER KING VILLARRICA|Villarrica|16:32:39',
  'BURGER KING 3 DE FEBRERO|Ciudad del Este|10:34:35',
  'BURGER KING CORONEL OVIEDO|Coronel Oviedo|11:54:13',
  'LA MADAME|Concepcion|19:36:07',
  'MANSION IRIGOYEN|Concepcion|10:36:55',
]);

// ── HELPERS ──────────────────────────────────────────────────
const isYes = v => (v||'').toLowerCase().startsWith('s');
const drv = u => {
  if(!u||!u.trim()) return null;
  const m = u.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : null;
};
const safeDrv = u => { try{return drv(u)}catch(e){return null} };

function getPhotosBF(r){
  return [r[BF.F1],r[BF.F2],r[BF.F3],r[BF.FAUS],r[BF.FANT]].map(safeDrv).filter(Boolean);
}
function getPhotosCP(r){
  return [r[CP.F1],r[CP.F2],r[CP.F3]].map(safeDrv).filter(Boolean);
}
function getPhotosTI_BF(r){
  return [r[TI.F1],r[TI.F2],r[TI.F3],r[TI.F4],r[TI.F5],r[TI.F6]].map(safeDrv).filter(Boolean);
}
function getPhotosTI_COMP(r){
  return [r[TI.FC1],r[TI.FC2],r[TI.FC3]].map(safeDrv).filter(Boolean);
}

// ── TAGS ─────────────────────────────────────────────────────
function matTagBF(r){
  return isYes(r[BF.HAY_MAT])?{c:'tg',l:'Con material'}:{c:'tr',l:'Sin material'};
}
function estTagBF(r){
  const e=r[BF.ESTADO_MAT]||'';
  if(!e) return{c:'tgr',l:'—'};
  if(e.includes('perfecto'))    return{c:'tg',l:'Buen estado'};
  if(e.includes('deteriorado')) return{c:'to',l:'Deteriorado'};
  if(e.includes('Poco visible')||e.includes('mal ubic')) return{c:'to',l:'Mal ubicado'};
  if(e.includes('No esta colocado')) return{c:'to',l:'No colocado'};
  if(e.includes('anterior'))    return{c:'ty',l:'Camp. anterior'};
  if(e.includes('corresponde')) return{c:'tb',l:'Correcto'};
  return{c:'tgr',l:e.substring(0,22)};
}
function conoceTagBF(v){
  const s=(v||'').toLowerCase();
  if(s.includes('bien'))     return{c:'tg',l:'Conoce promo'};
  if(s.includes('parcial'))  return{c:'to',l:'Parcialmente'};
  if(s.includes('no la conoce')) return{c:'tr',l:'No conoce'};
  return{c:'tgr',l:'Sin encargado'};
}
function visTag(v){
  const s=(v||'').toLowerCase();
  if(s.includes('mayor'))   return{c:'tr',l:'Mayor que BF'};
  if(s.includes('similar')) return{c:'to',l:'Similar a BF'};
  if(s.includes('menor'))   return{c:'tg',l:'Menor que BF'};
  return{c:'tgr',l:v||'—'};
}

// ── CSV PARSER ───────────────────────────────────────────────
function parseCSV(txt, skipRows){
  const n = skipRows||2;
  return txt.split('\n').slice(n).map(line=>{
    const cols=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ}
      else if(ch===','&&!inQ){cols.push(cur.trim());cur=''}
      else cur+=ch;
    }
    cols.push(cur.trim());
    return cols;
  }).filter(r=>r.some(c=>c.trim()!==''));
}

function dedupBF(rows){
  return rows.filter(r=>{
    const k=`${(r[BF.LOCAL]||'').trim()}|${(r[BF.CIUDAD]||'').trim()}|${(r[BF.HORA]||'').trim()}`;
    return !DROP.has(k);
  }).filter(r=>r[BF.LOCAL]&&r[BF.LOCAL].trim()!=='');
}

function cleanCP(rows){
  return rows.filter(r=>r[CP.LOCAL]&&r[CP.LOCAL].trim()!=='');
}

// ── GLOBAL SUMMARY ───────────────────────────────────────────
function buildGlobal(rows, period, isCompe, colLocal, colCiudad, colHayMat, colConoce){
  const total = rows.length;
  const con   = rows.filter(r=>isYes(r[colHayMat])).length;
  const sin   = total-con;
  const conoce= colConoce!=null ? rows.filter(r=>(r[colConoce]||'').toLowerCase().includes('bien')).length : 0;
  const pctCon  = total?Math.round(con/total*100):0;
  const pctKnow = total&&colConoce!=null?Math.round(conoce/total*100):0;

  const cityMap={};
  rows.forEach(r=>{
    const c=r[colCiudad]||'Sin ciudad';
    if(!cityMap[c])cityMap[c]={total:0,con:0};
    cityMap[c].total++;
    if(isYes(r[colHayMat]))cityMap[c].con++;
  });
  const cities=Object.entries(cityMap).sort((a,b)=>b[1].total-a[1].total).slice(0,6);
  const maxT=cities[0]?.[1].total||1;
  const bestCity=[...cities].sort((a,b)=>(b[1].con/b[1].total)-(a[1].con/a[1].total))[0];
  const bestPct=bestCity?Math.round(bestCity[1].con/bestCity[1].total*100):0;

  let insight;
  if(isCompe){
    insight=`${con} de ${total} locales relevados presentan material activo de otras entidades bancarias.${bestCity?` ${bestCity[0]} concentra mayor presencia con ${bestPct}% de locales con material competidor.`:''} Este análisis permite identificar los puntos donde BF enfrenta mayor exposición a materiales de otras instituciones y priorizar acciones de refuerzo.`;
  } else {
    const perfectos=rows.filter(r=>isYes(r[colHayMat])&&(r[BF.ESTADO_MAT]||'').includes('perfecto')).length;
    insight=`${con} de ${total} locales relevados cuentan con material BF presente y activo.${bestCity?` ${bestCity[0]} lidera con ${bestPct}% de cobertura.`:''} ${perfectos>0?perfectos+' locales presentan material en perfecto estado.':''} ${conoce} encargados conocen la promoción vigente, lo que representa una base sólida para reforzar la comunicación en puntos de menor presencia.`;
  }

  const cityHTML=cities.sort((a,b)=>b[1].total-a[1].total).map(([name,st])=>{
    const pct=Math.round(st.con/st.total*100);
    const bar=Math.round(st.total/maxT*100);
    return`<div class="cpill">
      <div class="cpill-name">${name}</div>
      <div class="cpill-stat">${st.total} relevados — <strong>${pct}%</strong> con material</div>
      <div class="cpill-bar"><div class="cpill-fill" style="width:${bar}%"></div></div>
    </div>`;
  }).join('');

  const gcLabel=isCompe?'Análisis de Competencia':'Resumen Global';
  const knowRow=colConoce!=null?`<div class="gm"><div class="gm-val">${conoce}</div><div class="gm-lbl">Encargados conocen promo</div><div class="gm-sub ${pctKnow>=50?'sp':'sm'}">${pctKnow}% del total</div></div>`:'<div class="gm"><div class="gm-val y">${pctCon}%</div><div class="gm-lbl">Cobertura</div><div class="gm-sub sm">Porcentaje con material</div></div>';

  return`<div class="gc">
    <div class="gc-lbl">${gcLabel}</div>
    <div class="gc-period">Período: ${period}</div>
    <div class="gc-metrics">
      <div class="gm"><div class="gm-val">${total}</div><div class="gm-lbl">Locales relevados</div><div class="gm-sub sm">${cities.length} ciudades cubiertas</div></div>
      <div class="gm"><div class="gm-val y">${con}</div><div class="gm-lbl">${isCompe?'Con material competencia':'Con material BF'}</div><div class="gm-sub sp">${pctCon}% de cobertura</div></div>
      ${knowRow}
      <div class="gm"><div class="gm-val">${sin}</div><div class="gm-lbl">${isCompe?'Sin material competencia':'Sin material BF'}</div><div class="gm-sub sn">${100-pctCon}% ${isCompe?'sin presencia':'oportunidad'}</div></div>
    </div>
    <div class="gc-insight">${insight}</div>
    <div class="city-grid">${cityHTML}</div>
  </div>`;
}

// ── ANÁLISIS COMPETENCIA GASTRO ───────────────────────────────
function buildCompeGastro(rows){
  // Marcas detectadas
  const brandMap={};
  rows.forEach(r=>{
    if(!isYes(r[CP.HAY_MAT])) return;
    const marcas=(r[CP.MARCAS]||'').split(/[,;\/]/);

      const b=m.trim();

    });

  const brands=Object.entries(brandMap).sort((a,b)=>b[1]-a[1]).slice(0,8);

  // Visibilidad
  const mayor=rows.filter(r=>(r[CP.VISIBILIDAD]||'').toLowerCase().includes('mayor')).length;
  const similar=rows.filter(r=>(r[CP.VISIBILIDAD]||'').toLowerCase().includes('similar')).length;

// ── KPIs BF ───────────────────────────────────────────────────
function buildKPIs(rows, period){
  const total=rows.length,con=rows.filter(r=>isYes(r[BF.HAY_MAT])).length;
  const sin=total-con,conoce=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('bien')).length;

  return`<div class="kpi-grid">
    <div class="kpi b"><div class="kpi-lbl">Locales relevados</div><div class="kpi-val">${total}</div><div class="kpi-sub" style="color:var(--muted)">${period}</div></div>
    <div class="kpi g"><div class="kpi-lbl">Con material BF</div><div class="kpi-val">${con}</div><div class="kpi-sub pos">${pct(con)}% del total</div></div>
    <div class="kpi r"><div class="kpi-lbl">Sin material BF</div><div class="kpi-val">${sin}</div><div class="kpi-sub neg">${pct(sin)}% del total</div></div>
    <div class="kpi y"><div class="kpi-lbl">Conocen la promo</div><div class="kpi-val">${conoce}</div><div class="kpi-sub ${pct(conoce)>=50?'pos':'mid'}">${pct(conoce)}% del total</div></div>
  </div>`;

// ── ALERTS BF ─────────────────────────────────────────────────
function buildAlerts(rows, colObs, colBen, colLocal){
  const seen=new Set(),al=[];
  const add=(t,x)=>{if(!seen.has(x)){seen.add(x);al.push({t,x})}};
  rows.forEach(r=>{
    const loc=r[colLocal]||'',obs=(r[colObs]||'').toLowerCase(),ben=(r[colBen]||'').toUpperCase();
    if(ben.includes('RETIRAR'))                             add('c',`${loc} — Beneficio marcado para retirar.`);
    if(obs.includes('cerrado definitivamente'))             add('c',`${loc} — Local cerrado definitivamente.`);
    if(obs.includes('cerrado por temporada'))              add('w',`${loc} — Cerrado por temporada baja.`);
    if(obs.includes('no se permite')||obs.includes('no se puede colocar')) add('w',`${loc} — No permite exhibir material.`);
    if(obs.includes('retir')&&!ben.includes('RETIRAR'))    add('c',`${loc} — Material retirado durante el relevamiento.`);
    if(obs.includes('solicita')||obs.includes('pidi')||obs.includes('interesado')) add('i',`${loc} — Encargado solicita material BF.`);
    if(obs.includes('no hay acuerdo'))                     add('w',`${loc} — Sin acuerdo vigente con BF.`);
    if(obs.includes('nueva administraci'))                 add('i',`${loc} — Nueva administración, convenio en gestión.`);
    if(obs.includes('local nuevo'))                        add('i',`${loc} — Local nuevo sin visita previa de BF.`);
    if(obs.includes('pegatina')||(obs.includes('enero')||obs.includes('febrero'))&&obs.includes('anterior')) add('w',`${loc} — Material de campaña anterior sin retirar.`);
  });
  if(!al.length) return'<div style="font-size:12px;color:var(--muted)">Sin alertas críticas detectadas.</div>';
  return`<ul class="al">${al.slice(0,12).map(a=>`<li class="ai ${a.t}"><span class="ad"></span><span>${a.x}</span></li>`).join('')}</ul>`;
}

// ── BAR ROWS ─────────────────────────────────────────────────
function barRows(items,maxV,col,minW){
  return items.map(([l,v])=>{
    const p=Math.round(v/maxV*100),c=l==='Sin material'?'var(--red)':col;
    const sh=l.length>30?l.substring(0,30)+'…':l;
    return`<div class="br"><span class="bl" style="min-width:${minW||150}px;font-size:11px">${sh}</span><div class="bt"><div class="bf" style="width:${p}%;background:${c}"></div></div><span class="bv">${v}</span></div>`;
  }).join('');
}
function cityDistBF(rows){const m={};rows.forEach(r=>{const c=r[BF.CIUDAD]||'Sin ciudad';m[c]=(m[c]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)}
function cityDistCP(rows){const m={};rows.forEach(r=>{const c=r[CP.CIUDAD]||'Sin ciudad';m[c]=(m[c]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)}
function matDistBF(rows){
  const m={};
  rows.forEach(r=>{if(isYes(r[BF.HAY_MAT])){const t=r[BF.TIPO_MAT]||'Sin especificar';m[t]=(m[t]||0)+1}});
  const sin=rows.filter(r=>!isYes(r[BF.HAY_MAT])).length;
  if(sin>0)m['Sin material']=sin;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function conoceDistBF(rows){
  const b=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('bien')).length;
  const p=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('parcial')).length;
  const n=rows.filter(r=>(r[BF.CONOCE]||'').toLowerCase().includes('no la conoce')).length;
  const o=rows.length-b-p-n;
  return[['La conoce bien',b,'var(--green)'],['Parcialmente',p,'var(--orange)'],['No la conoce',n,'var(--red)'],['Sin encargado',o,'var(--muted)']].filter(x=>x[1]>0);
}

// ── FILTER BAR ───────────────────────────────────────────────
function buildFilterBar(rows, uid, colCiudad, colTipo){
  const cities=[...new Set(rows.map(r=>r[colCiudad]).filter(Boolean))].sort();
  const tipos=colTipo!=null?[...new Set(rows.map(r=>r[colTipo]).filter(Boolean))].sort():[];
  return`<div class="fb">
    <span class="fl">Filtrar</span>
    <select class="fs" id="fc-${uid}" onchange="applyF('${uid}')">
      <option value="">Todas las ciudades</option>${cities.map(c=>`<option>${c}</option>`).join('')}
    </select>
    ${tipos.length?`<select class="fs" id="ft-${uid}" onchange="applyF('${uid}')">
      <option value="">Todos los tipos</option>${tipos.map(t=>`<option>${t}</option>`).join('')}
    </select>`:''}
    <span class="rc" id="rc-${uid}">${rows.length} locales</span>
  </div>`;
}

function applyF(uid){
  const ciudad=document.getElementById(`fc-${uid}`)?.value||'';
  const tipoEl=document.getElementById(`ft-${uid}`);
  const tipo=tipoEl?.value||'';
  const meta=_all[uid]?.meta||{};
  _filt[uid].rows=(_all[uid]?.rows||[]).filter(r=>{
    if(ciudad&&r[meta.colCiudad]!==ciudad) return false;
    if(tipo&&r[meta.colTipo]!==tipo)       return false;
    return true;
  });
  const rc=document.getElementById(`rc-${uid}`);
  if(rc)rc.textContent=`${_filt[uid].rows.length} locales`;
  const lc=document.getElementById(`lc-${uid}`);
  if(!lc)return;
  if(meta.renderer) lc.innerHTML=meta.renderer(_filt[uid].rows,uid);
}

function storeAndRender(uid, rows, colCiudad, colTipo, renderer){
  _all[uid]={rows, meta:{colCiudad,colTipo,renderer}};
  _filt[uid]={rows:[...rows]};
}

    </div>
    <div class="two-col">
      <div class="card"><div class="card-h">Material por tipo</div><div class="card-b">${barRows(md,mmx,'var(--blue)',180)}</div></div>
      <div class="card"><div class="card-h">Conocimiento de la promoción</div><div class="card-b">
        ${kd.map(([l,v,col])=>{const p=rows.length?Math.round(v/rows.length*100):0;return`<div class="br"><span class="bl">${l}</span><div class="bt"><div class="bf" style="width:${p}%;background:${col}"></div></div><span class="bv">${v}</span></div>`;}).join('')}
      </div></div>
    </div>
    <div class="sec-lbl" style="margin-bottom:12px">Detalle por local</div>
    ${buildFilterBar(rows,uid,BF.CIUDAD,BF.TIPO_LOCAL)}
    <div class="lg" id="lc-${uid}">${buildLocalesBF(rows,uid)}</div>`;
}

// ── BUILD GASTRO COMPE ────────────────────────────────────────
function buildGastroCompe(rows){
  const uid='g-cp';
  storeAndRender(uid,rows,CP.CIUDAD,CP.TIPO_LOCAL,buildLocalesCP);
  const cd=cityDistCP(rows),cmx=cd[0]?.[1]||1;
  return`
    ${buildGlobal(rows,PERIOD.gastro,true,CP.LOCAL,CP.CIUDAD,CP.HAY_MAT,null)}
    ${buildCompeGastro(rows)}
    <div class="two-col">
      <div class="card"><div class="card-h">Locales con competencia por ciudad</div><div class="card-b">${barRows(cd,cmx,'var(--orange)',140)}</div></div>
      <div class="card"><div class="card-h">Alertas de exposición</div><div class="card-b">${buildAlerts(rows,CP.OBS_PROMO,CP.MARCAS,CP.LOCAL)}</div></div>
    </div>
    <div class="sec-lbl" style="margin-bottom:12px">Detalle por local — competencia</div>
    ${buildFilterBar(rows,uid,CP.CIUDAD,CP.TIPO_LOCAL)}
    <div class="lg" id="lc-${uid}">${buildLocalesCP(rows,uid)}</div>`;
}

// ── BUILD TIENDAS ─────────────────────────────────────────────
function buildTiendasBF(rows){
  const uid='t-bf';
  storeAndRender(uid,rows,TI.FECHA,null,r=>buildLocalesTI(r,uid,false));
  const total=rows.length;
  const conPromo=rows.filter(r=>isYes(r[TI.MUESTRA_PROMO])).length;
  const pct=total?Math.round(conPromo/total*100):0;
  return`
    <div class="gc">
      <div class="gc-lbl">Resumen Global — Tiendas</div>
      <div class="gc-period">Período: ${PERIOD.tiendas}</div>
      <div class="gc-metrics">
        <div class="gm"><div class="gm-val">${total}</div><div class="gm-lbl">Locales relevados</div><div class="gm-sub sm">Relevamiento de tiendas</div></div>
        <div class="gm"><div class="gm-val y">${conPromo}</div><div class="gm-lbl">Muestran promo BF</div><div class="gm-sub sp">${pct}% del total</div></div>
        <div class="gm"><div class="gm-val">${total-conPromo}</div><div class="gm-lbl">Sin promo exhibida</div><div class="gm-sub sn">${100-pct}% del total</div></div>
        <div class="gm"><div class="gm-val y">${rows.filter(r=>(r[TI.CONOCE]||'').toLowerCase().includes('si')||isYes(r[TI.CONOCE])).length}</div><div class="gm-lbl">Conocen la promo</div><div class="gm-sub sm">Encargados informados</div></div>
      </div>
    </div>
    <div class="sec-lbl" style="margin-bottom:12px">Detalle por local — tiendas BF</div>
    ${buildFilterBar(rows,uid,TI.FECHA,null)}
    <div class="lg" id="lc-${uid}">${buildLocalesTI(rows,uid,false)}</div>`;
}

function buildTiendasCompe(rows){
  const uid='t-cp';
  const withComp=rows.filter(r=>(r[TI.MAT_COMP]||'').trim()!=='');
  storeAndRender(uid,withComp,TI.FECHA,null,r=>buildLocalesTI(r,uid,true));
  const total=rows.length, con=withComp.length;
  const pct=total?Math.round(con/total*100):0;
  return`
    <div class="gc">
      <div class="gc-lbl">Análisis de Competencia — Tiendas</div>
      <div class="gc-period">Período: ${PERIOD.tiendas}</div>
      <div class="gc-metrics">
        <div class="gm"><div class="gm-val">${total}</div><div class="gm-lbl">Locales relevados</div><div class="gm-sub sm">Total del relevamiento</div></div>
        <div class="gm"><div class="gm-val y">${con}</div><div class="gm-lbl">Con material competencia</div><div class="gm-sub sn">${pct}% del total</div></div>
        <div class="gm"><div class="gm-val">${total-con}</div><div class="gm-lbl">Sin material competencia</div><div class="gm-sub sp">${100-pct}% del total</div></div>
        <div class="gm"><div class="gm-val">${rows.filter(r=>isYes(r[TI.PROMO_COMP])).length}</div><div class="gm-lbl">Con promo competidora activa</div><div class="gm-sub sm">Promo exhibida</div></div>
      </div>
    </div>
    <div class="sec-lbl" style="margin-bottom:12px">Locales con material de competencia</div>
    ${buildFilterBar(withComp,uid,TI.FECHA,null)}
    <div class="lg" id="lc-${uid}">${buildLocalesTI(withComp,uid,true)}</div>`;
}

// ── BUILD TAB GASTRO ──────────────────────────────────────────
function buildTabGastro(bfRows, compeRows){
  document.getElementById('pbadge').textContent=PERIOD.gastro;
  const sub=`<div class="subnav" id="sn-g">
    <div class="stab active" onclick="switchSub('g','bf')">Banco Familiar</div>
    <div class="stab" onclick="switchSub('g','cp')">Análisis de Competencia</div>
  </div>`;
  const bfDiv =`<div id="sub-g-bf">${buildGastroBF(bfRows)}</div>`;
  const cpDiv =`<div id="sub-g-cp" style="display:none">${buildGastroCompe(compeRows)}</div>`;
  document.getElementById('tc-gastro').innerHTML=sub+bfDiv+cpDiv;
}

function buildTabTiendas(rows){
  document.getElementById('pbadge').textContent=PERIOD.tiendas;
  const sub=`<div class="subnav" id="sn-t">
    <div class="stab active" onclick="switchSub('t','bf')">Banco Familiar</div>
    <div class="stab" onclick="switchSub('t','cp')">Análisis de Competencia</div>
  </div>`;
  const bfDiv=`<div id="sub-t-bf">${buildTiendasBF(rows)}</div>`;
  const cpDiv=`<div id="sub-t-cp" style="display:none">${buildTiendasCompe(rows)}</div>`;
  document.getElementById('tc-tiendas').innerHTML=sub+bfDiv+cpDiv;
}

// ── SUBNAV ────────────────────────────────────────────────────
function switchSub(tabKey, sub){
  const tabs=document.querySelectorAll(`#sn-${tabKey} .stab`);
  tabs.forEach((t,i)=>t.classList.toggle('active',(sub==='bf'&&i===0)||(sub==='cp'&&i===1)));
  document.getElementById(`sub-${tabKey}-bf`).style.display = sub==='bf'?'':'none';
  document.getElementById(`sub-${tabKey}-cp`).style.display = sub==='cp'?'':'none';
}

// ── FETCH ─────────────────────────────────────────────────────
async function fetchCSV(gid, skipRows){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET}/export?format=csv&gid=${gid}`;
  const res=await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text(), skipRows||2);
}

async function loadGastro(){
  try{
    const [rawBF, rawCP]=await Promise.all([fetchCSV(GID.gastro_bf), fetchCSV(GID.gastro_compe)]);
    const bfRows=dedupBF(rawBF);
    const cpRows=cleanCP(rawCP);
    buildTabGastro(bfRows, cpRows);
  }catch(e){
    document.getElementById('tc-gastro').innerHTML=`<div class="nodata">Error cargando gastronómico: ${e.message}</div>`;
  }
}

async function loadTiendas(){
  try{
    // Hoja 3: encabezado doble — saltamos 1 fila (solo hay 1 fila de headers)
    const rows=await fetchCSV(GID.tiendas, 1);
    buildTabTiendas(rows.filter(r=>r[TI.LOCAL]&&r[TI.LOCAL].trim()!==''));
  }catch(e){
    document.getElementById('tc-tiendas').innerHTML=`<div class="nodata">Error cargando tiendas: ${e.message}</div>`;
  }
}

// ── UI HELPERS ────────────────────────────────────────────────
function tog(bId,cId){
  const b=document.getElementById(bId),c=document.getElementById(cId);
  if(!b)return;const o=b.classList.toggle('open');if(c)c.classList.toggle('open',o);
}
function openModal(url){if(!url||url==='null')return;document.getElementById('mimg').src=url;document.getElementById('modal').classList.add('open')}
function closeModal(e,force){if(force||(e&&e.target===document.getElementById('modal')))document.getElementById('modal').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal(null,true)});

let _loaded={gastro:false,tiendas:false};
function switchTab(tab){
  document.querySelectorAll('.ntab').forEach((t,i)=>t.classList.toggle('active',(tab==='gastro'&&i===0)||(tab==='tiendas'&&i===1)));
  document.querySelectorAll('.tc').forEach((t,i)=>t.classList.toggle('active',(tab==='gastro'&&i===0)||(tab==='tiendas'&&i===1)));
  document.getElementById('pbadge').textContent=PERIOD[tab];
  if(!_loaded[tab]){_loaded[tab]=true;tab==='gastro'?loadGastro():loadTiendas()}
}

_loaded.gastro=true;loadGastro();
</script>
</body>
</html>
