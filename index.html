<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tablero de Relevamiento — Banco Familiar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bf-navy: #1B3A6B;
  --bf-blue: #2D5FA6;
  --bf-yellow: #F5A800;
  --bf-yellow-light: #FFF3D0;
  --bf-gray-bg: #F2F4F7;
  --bf-gray-text: #4A4A4A;
  --bf-gray-muted: #8A8F9A;
  --bf-white: #ffffff;
  --bf-border: #DDE2EB;
  --bf-red: #C0392B;
  --bf-green: #1A7A4A;
  --bf-orange: #D4680A;
}
body { font-family: 'DM Sans', sans-serif; background: var(--bf-gray-bg); color: var(--bf-gray-text); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--bf-navy);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  border-bottom: 3px solid var(--bf-yellow);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 20px; }
.logo-img { height: 36px; }
.logo-fallback { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; display: none; }
.header-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.2); }
.header-title { color: rgba(255,255,255,0.8); font-size: 12px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
.period-badge {
  background: var(--bf-yellow);
  color: var(--bf-navy);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 4px;
  letter-spacing: 0.03em;
}

/* NAV */
.nav-tabs {
  background: var(--bf-white);
  border-bottom: 1px solid var(--bf-border);
  padding: 0 32px;
  display: flex;
  position: sticky;
  top: 67px;
  z-index: 99;
}
.nav-tab {
  padding: 14px 24px;
  font-size: 12px;
  font-weight: 500;
  color: var(--bf-gray-muted);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: -1px;
  user-select: none;
}
.nav-tab:hover { color: var(--bf-blue); }
.nav-tab.active { color: var(--bf-navy); border-bottom-color: var(--bf-yellow); font-weight: 600; }

/* CONTENT */
.content { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.kpi-card {
  background: var(--bf-white);
  border-radius: 10px;
  padding: 18px 20px;
  border: 1px solid var(--bf-border);
  position: relative;
  overflow: hidden;
}
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-card.blue::before { background: var(--bf-blue); }
.kpi-card.green::before { background: var(--bf-green); }
.kpi-card.red::before { background: var(--bf-red); }
.kpi-card.yellow::before { background: var(--bf-yellow); }
.kpi-label { font-size: 10px; color: var(--bf-gray-muted); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 8px; }
.kpi-value { font-size: 34px; font-weight: 600; color: var(--bf-navy); line-height: 1; }
.kpi-sub { font-size: 12px; margin-top: 6px; }
.good { color: var(--bf-green); }
.warn { color: var(--bf-orange); }
.bad { color: var(--bf-red); }

/* TWO COL */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

/* CARD */
.card { background: var(--bf-white); border-radius: 10px; border: 1px solid var(--bf-border); overflow: hidden; }
.card-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--bf-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-title { font-size: 11px; font-weight: 600; color: var(--bf-navy); text-transform: uppercase; letter-spacing: 0.08em; }
.card-body { padding: 18px 20px; }

/* BAR ROWS */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.bar-label { font-size: 12px; color: var(--bf-gray-text); min-width: 170px; flex-shrink: 0; }
.bar-track { flex: 1; height: 7px; background: var(--bf-gray-bg); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-val { font-size: 12px; font-weight: 600; color: var(--bf-navy); min-width: 28px; text-align: right; }

/* ALERTS */
.alert-list { list-style: none; }
.alert-item {
  padding: 10px 13px;
  border-radius: 7px;
  margin-bottom: 7px;
  font-size: 12px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
  border-left: 3px solid;
  line-height: 1.5;
}
.alert-item.critical { background: #FFF5F5; border-color: var(--bf-red); color: #7A1F1F; }
.alert-item.warning { background: #FFF9F0; border-color: var(--bf-orange); color: #7A3F0A; }
.alert-item.info { background: #EFF5FF; border-color: var(--bf-blue); color: #1B3A6B; }
.alert-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
.alert-item.critical .alert-dot { background: var(--bf-red); }
.alert-item.warning .alert-dot { background: var(--bf-orange); }
.alert-item.info .alert-dot { background: var(--bf-blue); }

/* FILTER BAR */
.filter-bar {
  background: var(--bf-white);
  border: 1px solid var(--bf-border);
  border-radius: 10px;
  padding: 13px 20px;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.filter-label { font-size: 10px; font-weight: 700; color: var(--bf-gray-muted); text-transform: uppercase; letter-spacing: 0.09em; }
.filter-select {
  border: 1px solid var(--bf-border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--bf-navy);
  background: var(--bf-gray-bg);
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
}
.filter-select:focus { outline: none; border-color: var(--bf-blue); }
.results-count { font-size: 12px; color: var(--bf-gray-muted); margin-left: auto; font-weight: 500; }

/* TAGS */
.tag {
  padding: 3px 9px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  white-space: nowrap;
}
.tag-green { background: #E6F5EC; color: #145A35; }
.tag-red { background: #FDEAEA; color: #921F1F; }
.tag-orange { background: #FEF3E6; color: #994D08; }
.tag-gray { background: var(--bf-gray-bg); color: var(--bf-gray-muted); }
.tag-blue { background: #EAF0FB; color: #1B3A6B; }
.tag-yellow { background: var(--bf-yellow-light); color: #7A5500; }

/* LOCAL CARDS */
.local-grid { display: flex; flex-direction: column; gap: 10px; }
.local-card { background: var(--bf-white); border-radius: 10px; border: 1px solid var(--bf-border); overflow: hidden; }
.local-header {
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: background 0.15s;
  flex-wrap: wrap;
}
.local-header:hover { background: var(--bf-gray-bg); }
.local-info { flex: 1; min-width: 180px; }
.local-name { font-size: 14px; font-weight: 600; color: var(--bf-navy); }
.local-city { font-size: 11px; color: var(--bf-gray-muted); margin-top: 2px; }
.chevron { font-size: 12px; color: var(--bf-gray-muted); transition: transform 0.2s; margin-left: auto; flex-shrink: 0; }
.chevron.open { transform: rotate(180deg); }

.local-body { padding: 0 20px 20px; display: none; }
.local-body.open { display: block; }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 28px;
  border-top: 1px solid var(--bf-border);
  padding-top: 16px;
  margin-bottom: 14px;
}
.detail-key { font-size: 10px; color: var(--bf-gray-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
.detail-val { font-size: 13px; color: var(--bf-navy); font-weight: 500; }

.obs-box {
  background: var(--bf-gray-bg);
  border-radius: 7px;
  padding: 11px 14px;
  font-size: 12px;
  color: var(--bf-gray-text);
  margin-bottom: 16px;
  border-left: 3px solid var(--bf-yellow);
  line-height: 1.6;
}

.photos-label { font-size: 10px; font-weight: 700; color: var(--bf-gray-muted); text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 10px; }
.photos-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.photo-thumb {
  width: 120px;
  height: 85px;
  border-radius: 7px;
  object-fit: cover;
  border: 1px solid var(--bf-border);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.photo-thumb:hover { transform: scale(1.04); box-shadow: 0 4px 16px rgba(27,58,107,0.15); }
.photo-placeholder {
  width: 120px;
  height: 85px;
  border-radius: 7px;
  background: var(--bf-gray-bg);
  border: 1px dashed var(--bf-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--bf-gray-muted);
  text-align: center;
}

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,20,40,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modal-overlay.open { display: flex; }
.modal-img { max-width: 90vw; max-height: 88vh; border-radius: 8px; object-fit: contain; }
.modal-close {
  position: fixed; top: 18px; right: 22px;
  color: #fff; font-size: 26px; cursor: pointer;
  background: rgba(255,255,255,0.1);
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }

/* SECTION HEADER */
.section-header { margin-bottom: 16px; }
.section-title { font-size: 10px; font-weight: 700; color: var(--bf-gray-muted); text-transform: uppercase; letter-spacing: 0.1em; }

/* LOADER / EMPTY */
.loader { text-align: center; padding: 80px; color: var(--bf-gray-muted); font-size: 14px; }
.no-data { text-align: center; padding: 60px; color: var(--bf-gray-muted); font-size: 14px; }

/* COMING SOON */
.coming-soon {
  background: var(--bf-white);
  border: 1px solid var(--bf-border);
  border-radius: 10px;
  padding: 60px;
  text-align: center;
  color: var(--bf-gray-muted);
}
.coming-soon strong { display: block; font-size: 16px; color: var(--bf-navy); margin-bottom: 8px; }

@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(2,1fr); }
  .two-col { grid-template-columns: 1fr; }
  .header { padding: 0 16px; }
  .nav-tabs { padding: 0 16px; }
  .content { padding: 20px 16px; }
  .detail-grid { grid-template-columns: 1fr; }
  .header-title { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="https://raw.githubusercontent.com/dmfadev/TABLERO-BF/main/logo%20banco%20familiar.png"
         class="logo-img"
         alt="Banco Familiar"
         onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='block'" />
    <span id="logo-fallback" class="logo-fallback">BANCO FAMILIAR</span>
    <div class="header-divider"></div>
    <span class="header-title">Tablero de Relevamiento de Materiales</span>
  </div>
  <div id="period-display" class="period-badge">—</div>
</div>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="switchTab('gastro')">Relevamiento Gastronómico</div>
  <div class="nav-tab" onclick="switchTab('tiendas')">Relevamiento Tiendas</div>
</div>

<div class="content">
  <div id="tab-gastro" class="tab-content active">
    <div id="gastro-content"><div class="loader">Cargando datos...</div></div>
  </div>
  <div id="tab-tiendas" class="tab-content">
    <div class="coming-soon">
      <strong>Relevamiento de Tiendas</strong>
      Módulo disponible próximamente. Cargue los datos en la pestaña RE_BF_TIENDAS para habilitar este análisis.
    </div>
  </div>
</div>

<div class="modal-overlay" id="photoModal" onclick="closeModal(event)">
  <button class="modal-close" onclick="closeModal(null, true)">&#10005;</button>
  <img class="modal-img" id="modalImg" src="" alt="Evidencia fotográfica" />
</div>

<script>
// ─── CONFIGURACIÓN ──────────────────────────────────────────────
const SHEET_ID   = '1YrNdJ_Hf9AyrKm_MpO3FgyqLWs4x3iNRuQv9AfNpnok';
const GID_GASTRO = '0';
const PERIOD_GASTRO = '20 al 25 de mayo 2026';

// Filas a descartar: duplicados donde se conserva la más reciente
// Índices basados en posición en el array de datos (0-based tras quitar headers)
// LOCAL → keep latest, drop earlier occurrences
const DUPLICATE_KEYS_TO_DROP = new Set([
  // Identificados por combo LOCAL+CIUDAD+HORA de la entrada MÁS ANTIGUA
  '595 LOUNGE|Ciudad del Este|14:00:43',         // fila 5  → keep fila 39 (22/05)
  'LA CAROLINA CAFE BISTRO|Ciudad del Este|15:13:17', // fila 23 → keep fila 24... BUT fila24=idéntica, drop fila 24 en vez (26s después)
  'LA CAROLINA CAFE BISTRO|Ciudad del Este|15:13:43', // drop la segunda (26s, misma info)
  'BURGER KING VILLARRICA|Villarrica|16:31:21',   // fila 28 → drop
  'BURGER KING VILLARRICA|Villarrica|16:32:39',   // fila 29 → drop
  'BURGER KING 3 DE FEBRERO|Ciudad del Este|10:34:35', // fila 42 → drop
  'BURGER KING CORONEL OVIEDO|Coronel Oviedo|11:54:13', // fila 48 → drop (keep 50)
  'LA MADAME|Concepcion|19:36:07',               // fila 34 → drop (keep propietaria fila 36)
  'MANSION IRIGOYEN|Concepcion|10:36:55',        // fila 13 → drop (keep fila 15)
]);

// ─── COLUMNAS ───────────────────────────────────────────────────
const C = {
  FECHA:0, HORA:1, FISCALIZADOR:2, LOCAL:3, NOMBRE_ID:4,
  CIUDAD:5, TIPO_LOCAL:6, TIPO_MAT_ASIGNADO:7, DIA_PROMO:8,
  BENEFICIO:9, HAY_MATERIAL:10, TIPO_MAT_ENCONTRADO:11,
  MATS_COLOCADOS:12, CORRESPONDE_TIPO:13, ESTADO_MAT:14,
  BENEFICIO_EXHIBIDO:15, OFERTA_CORRECTA:16, HAY_MAT_ANTERIOR:17,
  TIPO_MAT_ANTERIOR:18, ENCARGADO_CONOCE:19, NOMBRE_ENCARGADO:20,
  OBSERVACIONES:21, ESTADO_ENVIO:22,
  FOTO1:23, FOTO2:24, FOTO3:25, FOTO_AUSENCIA:26, FOTO_ANTERIOR:27
};

// ─── HELPERS ────────────────────────────────────────────────────
function driveUrl(raw) {
  if (!raw || !raw.trim()) return null;
  const m = raw.match(/\/d\/([a-zA-Z0-9_-]+)/);
  return m ? `https://drive.google.com/uc?export=view&id=${m[1]}` : null;
}

function getPhotos(row) {
  return [row[C.FOTO1], row[C.FOTO2], row[C.FOTO3], row[C.FOTO_AUSENCIA], row[C.FOTO_ANTERIOR]]
    .map(driveUrl).filter(Boolean);
}

function isYes(val) {
  return (val||'').toLowerCase().startsWith('s');
}

function matTag(row) {
  return isYes(row[C.HAY_MATERIAL])
    ? { cls:'tag-green', label:'Con material' }
    : { cls:'tag-red',   label:'Sin material' };
}

function estadoTag(row) {
  const e = row[C.ESTADO_MAT] || '';
  if (!e) return { cls:'tag-gray', label:'—' };
  if (e.includes('perfecto')) return { cls:'tag-green', label:'Buen estado' };
  if (e.includes('deteriorado')) return { cls:'tag-orange', label:'Deteriorado' };
  if (e.includes('Poco visible') || e.includes('mal ubicado')) return { cls:'tag-orange', label:'Mal ubicado' };
  if (e.includes('No esta colocado')) return { cls:'tag-orange', label:'No colocado' };
  if (e.includes('anterior')) return { cls:'tag-yellow', label:'Camp. anterior' };
  if (e.includes('corresponde')) return { cls:'tag-blue', label:'Correcto' };
  return { cls:'tag-gray', label: e.length > 28 ? e.substring(0,28)+'…' : e };
}

function conoceTag(val) {
  const v = (val||'').toLowerCase();
  if (v.includes('bien'))       return { cls:'tag-green',  label:'Conoce promo' };
  if (v.includes('parcial'))    return { cls:'tag-orange', label:'Conoce parcial' };
  if (v.includes('no la conoce')) return { cls:'tag-red', label:'No conoce' };
  if (v.includes('no habia'))   return { cls:'tag-gray',   label:'Sin encargado' };
  return { cls:'tag-gray', label: val ? val.substring(0,20) : 'No informado' };
}

// ─── DEDUPLICATION ──────────────────────────────────────────────
function dedup(rows) {
  return rows.filter(r => {
    const key = `${(r[C.LOCAL]||'').trim()}|${(r[C.CIUDAD]||'').trim()}|${(r[C.HORA]||'').trim()}`;
    return !DUPLICATE_KEYS_TO_DROP.has(key);
  });
}

// ─── BUILD KPIs ─────────────────────────────────────────────────
function buildKPIs(rows) {
  const total   = rows.length;
  const conMat  = rows.filter(r => isYes(r[C.HAY_MATERIAL])).length;
  const sinMat  = total - conMat;
  const conoce  = rows.filter(r => (r[C.ENCARGADO_CONOCE]||'').toLowerCase().includes('bien')).length;
  const pctMat  = total ? Math.round(conMat/total*100) : 0;
  const pctKnow = total ? Math.round(conoce/total*100) : 0;

  return `<div class="kpi-grid">
    <div class="kpi-card blue">
      <div class="kpi-label">Locales relevados</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-sub" style="color:var(--bf-gray-muted)">Período ${PERIOD_GASTRO}</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-label">Con material BF</div>
      <div class="kpi-value">${conMat}</div>
      <div class="kpi-sub good">${pctMat}% del total</div>
    </div>
    <div class="kpi-card red">
      <div class="kpi-label">Sin material BF</div>
      <div class="kpi-value">${sinMat}</div>
      <div class="kpi-sub bad">${100-pctMat}% del total</div>
    </div>
    <div class="kpi-card yellow">
      <div class="kpi-label">Encargado conoce promo</div>
      <div class="kpi-value">${conoce}</div>
      <div class="kpi-sub ${pctKnow>=60?'good':'warn'}">${pctKnow}% del total</div>
    </div>
  </div>`;
}

// ─── BUILD ALERTS ───────────────────────────────────────────────
function buildAlerts(rows) {
  const seen = new Set();
  const alerts = [];
  const add = (type, text) => { if (!seen.has(text)) { seen.add(text); alerts.push({type,text}); } };

  rows.forEach(r => {
    const local = r[C.LOCAL] || '';
    const obs   = (r[C.OBSERVACIONES]||'').toLowerCase();
    const ben   = (r[C.BENEFICIO]||'').toUpperCase();
    if (ben.includes('RETIRAR'))
      add('critical', `${local} — Beneficio marcado para retirar.`);
    if (obs.includes('cerrado definitivamente') || obs.includes('local cerrado'))
      add('critical', `${local} — Local cerrado definitivamente.`);
    if (obs.includes('cerrado por temporada'))
      add('warning', `${local} — Cerrado por temporada baja.`);
    if (obs.includes('no se permite') || obs.includes('no se puede colocar') || obs.includes('no se cuenta con materiales'))
      add('warning', `${local} — No se permite exhibir material de BF.`);
    if (obs.includes('retir') && !ben.includes('RETIRAR'))
      add('critical', `${local} — Material retirado durante el relevamiento.`);
    if (obs.includes('solicita') || obs.includes('interesado') || obs.includes('pidi'))
      add('info', `${local} — Encargado solicita o muestra interés en material BF.`);
    if (obs.includes('no hay acuerdo'))
      add('warning', `${local} — Sin acuerdo vigente con BF según encargado.`);
    if (obs.includes('no tiene conocimiento de estar como aliados'))
      add('warning', `${local} — Propietario desconoce alianza activa con BF.`);
    if (obs.includes('nueva administración') || obs.includes('nueva administracion'))
      add('info', `${local} — Local con nueva administración, convenio en gestión.`);
    if (obs.includes('pegatina') || obs.includes('calco') && obs.includes('enero'))
      add('warning', `${local} — Material de campaña anterior sin retirar.`);
  });

  if (!alerts.length) return '<div style="font-size:12px;color:var(--bf-gray-muted);padding:8px 0">Sin alertas críticas detectadas.</div>';
  return `<ul class="alert-list">${alerts.slice(0,12).map(a =>
    `<li class="alert-item ${a.type}"><span class="alert-dot"></span><span>${a.text}</span></li>`
  ).join('')}</ul>`;
}

// ─── BUILD CHARTS DATA ──────────────────────────────────────────
function cityDist(rows) {
  const m = {};
  rows.forEach(r => { const c = r[C.CIUDAD]||'Sin ciudad'; m[c]=(m[c]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,9);
}

function matTypeDist(rows) {
  const m = {};
  rows.forEach(r => {
    if (isYes(r[C.HAY_MATERIAL])) {
      const t = r[C.TIPO_MAT_ENCONTRADO]||'Sin especificar';
      m[t]=(m[t]||0)+1;
    }
  });
  const sinMat = rows.filter(r=>!isYes(r[C.HAY_MATERIAL])).length;
  if (sinMat>0) m['Sin material']=sinMat;
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}

function conoceDist(rows) {
  const bien  = rows.filter(r=>(r[C.ENCARGADO_CONOCE]||'').toLowerCase().includes('bien')).length;
  const parc  = rows.filter(r=>(r[C.ENCARGADO_CONOCE]||'').toLowerCase().includes('parcial')).length;
  const no    = rows.filter(r=>{ const v=(r[C.ENCARGADO_CONOCE]||'').toLowerCase(); return v.includes('no la conoce'); }).length;
  const otros = rows.length - bien - parc - no;
  return [
    {label:'La conoce bien', val:bien, color:'var(--bf-green)'},
    {label:'La conoce parcialmente', val:parc, color:'var(--bf-orange)'},
    {label:'No la conoce', val:no, color:'var(--bf-red)'},
    {label:'Sin encargado / no informado', val:otros, color:'var(--bf-gray-muted)'},
  ].filter(x=>x.val>0);
}

function barRows(items, maxVal, color, labelMinWidth) {
  return items.map(([label, val]) => {
    const pct = Math.round((val/maxVal)*100);
    const short = label.length > 32 ? label.substring(0,32)+'…' : label;
    const c = label==='Sin material' ? 'var(--bf-red)' : color;
    return `<div class="bar-row">
      <span class="bar-label" style="min-width:${labelMinWidth||170}px;font-size:11px">${short}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${c}"></div></div>
      <span class="bar-val">${val}</span>
    </div>`;
  }).join('');
}

// ─── BUILD LOCAL CARDS ──────────────────────────────────────────
function buildLocales(rows) {
  if (!rows.length) return '<div class="no-data">No se encontraron resultados con los filtros seleccionados.</div>';
  return rows.map((row, idx) => {
    const mTag    = matTag(row);
    const eTag    = estadoTag(row);
    const cTag    = conoceTag(row[C.ENCARGADO_CONOCE]);
    const photos  = getPhotos(row);
    const obs     = row[C.OBSERVACIONES]||'';
    const encargado = row[C.NOMBRE_ENCARGADO]||'No informado';
    const beneficio = row[C.BENEFICIO]||'—';
    const tipoLocal = row[C.TIPO_LOCAL]||'';
    const tipoMat   = row[C.TIPO_MAT_ENCONTRADO]||'';
    const matColo   = row[C.MATS_COLOCADOS]||'';
    const oferta    = row[C.OFERTA_CORRECTA]||'';
    const hayAnt    = row[C.HAY_MAT_ANTERIOR]||'';
    const tipoAnt   = row[C.TIPO_MAT_ANTERIOR]||'';

    const photosHtml = photos.length
      ? photos.map(url =>
          `<img class="photo-thumb" src="${url}" alt="Evidencia"
            onclick="openModal('${url}')"
            onerror="this.style.display='none'" />`
        ).join('')
      : `<div class="photo-placeholder">Sin evidencia<br>fotográfica</div>`;

    const obsHtml = obs
      ? `<div class="obs-box"><strong>Observación:</strong> ${obs}</div>`
      : '';

    const anteriorHtml = isYes(hayAnt)
      ? `<div><div class="detail-key">Material anterior</div><div class="detail-val">${tipoAnt||'Sí'}</div></div>`
      : '';

    return `
      <div class="local-card">
        <div class="local-header" onclick="toggleLocal('lbody-${idx}','lchev-${idx}')">
          <div class="local-info">
            <div class="local-name">${row[C.LOCAL]||'Sin nombre'}</div>
            <div class="local-city">${row[C.CIUDAD]||''} · ${tipoLocal}</div>
          </div>
          <span class="tag ${mTag.cls}">${mTag.label}</span>
          ${tipoMat ? `<span class="tag tag-blue" style="font-size:10px;max-width:160px;overflow:hidden;text-overflow:ellipsis">${tipoMat.length>22?tipoMat.substring(0,22)+'…':tipoMat}</span>` : ''}
          <span class="tag ${cTag.cls}">${cTag.label}</span>
          <span class="chevron" id="lchev-${idx}">&#9660;</span>
        </div>
        <div class="local-body" id="lbody-${idx}">
          <div class="detail-grid">
            <div><div class="detail-key">Beneficio vigente</div><div class="detail-val">${beneficio}</div></div>
            <div><div class="detail-key">Estado del material</div><div class="detail-val"><span class="tag ${eTag.cls}">${eTag.label}</span></div></div>
            ${tipoMat ? `<div><div class="detail-key">Tipo de material encontrado</div><div class="detail-val">${tipoMat}</div></div>` : ''}
            ${matColo ? `<div><div class="detail-key">Materiales colocados</div><div class="detail-val">${matColo}</div></div>` : ''}
            ${oferta  ? `<div><div class="detail-key">Oferta exhibida correctamente</div><div class="detail-val">${oferta}</div></div>` : ''}
            <div><div class="detail-key">Responsable del local</div><div class="detail-val">${encargado}</div></div>
            ${anteriorHtml}
          </div>
          ${obsHtml}
          <div class="photos-label">Evidencia fotográfica</div>
          <div class="photos-grid">${photosHtml}</div>
        </div>
      </div>`;
  }).join('');
}

// ─── FILTERS ────────────────────────────────────────────────────
let allRows = [], filteredRows = [];

function buildFilterBar(rows) {
  const cities = [...new Set(rows.map(r=>r[C.CIUDAD]).filter(Boolean))].sort();
  const tipos  = [...new Set(rows.map(r=>r[C.TIPO_LOCAL]).filter(Boolean))].sort();
  return `<div class="filter-bar">
    <span class="filter-label">Filtrar por</span>
    <select class="filter-select" id="fil-ciudad" onchange="applyFilters()">
      <option value="">Todas las ciudades</option>
      ${cities.map(c=>`<option value="${c}">${c}</option>`).join('')}
    </select>
    <select class="filter-select" id="fil-tipo" onchange="applyFilters()">
      <option value="">Todos los tipos</option>
      ${tipos.map(t=>`<option value="${t}">${t}</option>`).join('')}
    </select>
    <select class="filter-select" id="fil-material" onchange="applyFilters()">
      <option value="">Todo el material</option>
      <option value="con">Con material BF</option>
      <option value="sin">Sin material BF</option>
    </select>
    <select class="filter-select" id="fil-conoce" onchange="applyFilters()">
      <option value="">Conocimiento de promo</option>
      <option value="bien">La conoce bien</option>
      <option value="no">No la conoce</option>
    </select>
    <span class="results-count" id="results-count">${rows.length} locales</span>
  </div>`;
}

function applyFilters() {
  const ciudad   = document.getElementById('fil-ciudad').value;
  const tipo     = document.getElementById('fil-tipo').value;
  const material = document.getElementById('fil-material').value;
  const conoce   = document.getElementById('fil-conoce').value;

  filteredRows = allRows.filter(r => {
    if (ciudad   && r[C.CIUDAD]     !== ciudad)   return false;
    if (tipo     && r[C.TIPO_LOCAL] !== tipo)     return false;
    if (material === 'con' && !isYes(r[C.HAY_MATERIAL]))  return false;
    if (material === 'sin' &&  isYes(r[C.HAY_MATERIAL]))  return false;
    if (conoce === 'bien' && !(r[C.ENCARGADO_CONOCE]||'').toLowerCase().includes('bien')) return false;
    if (conoce === 'no'   && !(r[C.ENCARGADO_CONOCE]||'').toLowerCase().includes('no la conoce')) return false;
    return true;
  });

  document.getElementById('results-count').textContent = `${filteredRows.length} locales`;
  document.getElementById('locales-container').innerHTML = buildLocales(filteredRows);
}

// ─── ASSEMBLE PAGE ──────────────────────────────────────────────
function buildPage(rows) {
  document.getElementById('period-display').textContent = PERIOD_GASTRO;
  allRows = rows;
  filteredRows = rows;

  const cityItems = cityDist(rows);
  const matItems  = matTypeDist(rows);
  const conItems  = conoceDist(rows);
  const cityMax   = cityItems[0]?.[1] || 1;
  const matMax    = Math.max(...matItems.map(x=>x[1]), 1);

  const html = `
    ${buildKPIs(rows)}

    <div class="two-col">
      <div class="card">
        <div class="card-header"><span class="card-title">Locales por ciudad</span></div>
        <div class="card-body">${barRows(cityItems, cityMax, 'var(--bf-blue)', 150)}</div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Hallazgos y alertas</span></div>
        <div class="card-body">${buildAlerts(rows)}</div>
      </div>
    </div>

    <div class="two-col">
      <div class="card">
        <div class="card-header"><span class="card-title">Material encontrado por tipo</span></div>
        <div class="card-body">${barRows(matItems, matMax, 'var(--bf-blue)', 190)}</div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Conocimiento de la promoción</span></div>
        <div class="card-body">
          ${conItems.map(item => {
            const pct = rows.length ? Math.round(item.val/rows.length*100) : 0;
            return `<div class="bar-row">
              <span class="bar-label">${item.label}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${item.color}"></div></div>
              <span class="bar-val">${item.val}</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <div class="section-header">
      <span class="section-title">Detalle por local — clic para expandir</span>
    </div>

    ${buildFilterBar(rows)}

    <div class="local-grid" id="locales-container">
      ${buildLocales(rows)}
    </div>`;

  document.getElementById('gastro-content').innerHTML = html;
}

// ─── CSV PARSER ─────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n');
  const dataLines = lines.slice(2); // skip 2 header rows
  return dataLines.map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    return cols;
  }).filter(r => r[C.LOCAL] && r[C.LOCAL].trim() !== '');
}

// ─── LOAD DATA ──────────────────────────────────────────────────
async function loadData() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID_GASTRO}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const raw  = parseCSV(text);
    const rows = dedup(raw);
    buildPage(rows);
  } catch(e) {
    document.getElementById('gastro-content').innerHTML =
      `<div class="no-data">Error al cargar los datos: ${e.message}<br><br>
       Verificá que el Google Sheet tenga acceso público ("Cualquier persona con el enlace puede ver").</div>`;
  }
}

// ─── UI ACTIONS ─────────────────────────────────────────────────
function toggleLocal(bodyId, chevId) {
  const body = document.getElementById(bodyId);
  const chev = document.getElementById(chevId);
  if (!body) return;
  const open = body.classList.toggle('open');
  if (chev) chev.classList.toggle('open', open);
}

function openModal(url) {
  document.getElementById('modalImg').src = url;
  document.getElementById('photoModal').classList.add('open');
}

function closeModal(e, force) {
  if (force || (e && e.target === document.getElementById('photoModal'))) {
    document.getElementById('photoModal').classList.remove('open');
  }
}

function switchTab(tab) {
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', (tab==='gastro' && i===0) || (tab==='tiendas' && i===1));
  });
  document.getElementById('tab-gastro').classList.toggle('active', tab==='gastro');
  document.getElementById('tab-tiendas').classList.toggle('active', tab==='tiendas');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal(null, true);
});

loadData();
</script>
</body>
</html>
